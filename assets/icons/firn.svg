<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Firn">
  <!--
    Das App-Symbol von Firn: eine Slalomspur mit zwei Toren.

    ── Warum nicht das n ────────────────────────────────────────────
    Der erste Entwurf war der Buchstabe aus dem Wortzeichen. Er
    funktioniert IM Wort, weil er dort die Farbe traegt —
    herausgeloest verliert er seinen Grund. Er sagt nichts ueber
    Schnee, Berg oder Training, und Buchstabenmarken gibt es
    tausende.

    Die Spur sagt in einem Blick, worum es geht.

    ── Warum die Tore so gross sind ─────────────────────────────────
    Der erste Zuschnitt hatte sie mit Radius 3.2 neben der Kurve. Bei
    16 Pixeln — der Groesse im Browsertab — waren sie 0.8 Pixel breit
    und schlicht verschwunden. Mit 4.4 und enger an der Spur ueberleben
    sie; nachgemessen an einer 16-Pixel-Ausgabe, vierfach vergroessert.

    Eine dritte Variante setzte die Tore AUF die Spur. Dort verschmelzen
    sie im Kleinen mit dem Weiss zu einem Klecks.

    ── Maskierbar ───────────────────────────────────────────────────
    Android beschneidet Symbole auf einen Kreis. Der aeusserste Punkt
    liegt rund 20 von 32 Einheiten vom Mittelpunkt entfernt, die
    Grenze bei 25.6.

    Die runden Ecken hat nur diese Fassung. Die PNG-Symbole sind
    randlos: Android und iOS legen ihre eigene Maske darueber, und ein
    Symbol, das seine Ecken selbst rundet, bekaeme eine doppelte.
  -->
  <defs>
    <linearGradient id="firnGrund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2138" />
      <stop offset="1" stop-color="#1256B0" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#firnGrund)" />

  <!-- Zwei Schwuenge: rechts herum, dann links herum. -->
  <path d="M32 16 a9 9 0 0 1 0 18 a9 9 0 0 0 0 18"
        fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />

  <!-- Die Tore im Alpengluehen — dieselbe warme Farbe wie auf der
       Willkommen-Seite, und der einzige Ort im Symbol, an dem sie
       vorkommt. -->
  <circle cx="45" cy="25" r="4.4" fill="#F6A183" />
  <circle cx="19" cy="43" r="4.4" fill="#F6A183" />
</svg>
