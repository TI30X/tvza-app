<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/css/kit.css?v=4">
<link rel="stylesheet" href="/assets/css/legacy.css?v=1">
<title>Player — Entwurf</title></head>
<body class="app"><main class="main" style="padding:16px;max-width:420px;margin:0 auto">

  <button class="backlink" type="button">
    <svg class="ic" viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Einheit wechseln</span>
  </button>

  <div class="fortschritt" role="progressbar" aria-label="2 von 6 erledigt">
    <span class="fortschritt__fuellung" style="width:33%"></span>
  </div>

  <div class="form-card">
    <p class="empty-hint">Übung 2 von 6</p>

    <div class="ueb-kopf">
      <div class="form-title">Sprünge mit Kurzhantel</div>
      <a class="ueb-video" href="https://www.youtube.com/shorts/lEjSFEH4bRk"
         target="_blank" rel="noopener" title="Video ansehen" aria-label="Video ansehen">
        <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </a>
    </div>
    <p class="empty-hint">Pause 120-180 Sec · TUT 2010</p>

    <div class="rows">
      <!-- gemacht, genau wie geplant → zugeklappt -->
      <div class="row satz satz--gemacht" data-bereich="t-training">
        <button class="satz__haken" type="button" aria-pressed="true" aria-label="Satz 1 wie geplant">
          <svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
        <span class="row__body"><span class="row__title">1. Satz</span><span class="row__sub">5× 60</span></span>
        <span class="row__end">
          <span class="satz__wert">5× 60</span>
          <button class="row__aktion" type="button" title="Anders gelaufen" aria-label="Anders gelaufen">
            <svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </span>
      </div>

      <!-- gemacht, aber abweichend → Felder offen -->
      <div class="row satz satz--gemacht" data-bereich="t-training">
        <button class="satz__haken" type="button" aria-pressed="true" aria-label="Satz 2 wie geplant">
          <svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
        <span class="row__body"><span class="row__title">2. Satz</span><span class="row__sub">5× 60</span></span>
        <span class="row__end">
          <input class="form-input" type="text" inputmode="decimal" value="65" style="width:62px" aria-label="Wert 2. Satz">
          <input class="form-input" type="text" inputmode="numeric" value="4" style="width:50px" aria-label="Wiederholungen 2. Satz">
        </span>
      </div>

      <!-- offen -->
      <div class="row satz" data-bereich="t-training">
        <button class="satz__haken" type="button" aria-pressed="false" aria-label="Satz 3 wie geplant">3</button>
        <span class="row__body"><span class="row__title">3. Satz</span><span class="row__sub">5× 60</span></span>
        <span class="row__end">
          <span class="satz__wert"></span>
          <button class="row__aktion" type="button" title="Anders gelaufen" aria-label="Anders gelaufen">
            <svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </span>
      </div>

      <div class="row satz" data-bereich="t-training">
        <button class="satz__haken" type="button" aria-pressed="false" aria-label="Satz 4 wie geplant">4</button>
        <span class="row__body"><span class="row__title">4.Satz</span><span class="row__sub">5× 60</span></span>
        <span class="row__end">
          <span class="satz__wert"></span>
          <button class="row__aktion" type="button" title="Anders gelaufen" aria-label="Anders gelaufen">
            <svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </span>
      </div>
    </div>

    <div>
      <div class="marke brief__marke">Andere Trainingswoche</div>
      <div class="vorwoche">
        <span class="vorwoche__tag">TW18</span>
        <span class="vorwoche__werte">62 · 62 · 60 · 60</span>
        <span class="vorwoche__notiz">ging besser</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="n">Notiz</label>
      <input class="form-input" id="n" type="text" placeholder="z.B. zog im Knie">
    </div>

    <button class="b b--primary b--block" type="button">Übung erledigt</button>
  </div>

  <div class="seg" role="group">
    <button class="seg__item" type="button">Zurück</button>
    <button class="seg__item" type="button">Weiter</button>
  </div>

</main></body></html>
