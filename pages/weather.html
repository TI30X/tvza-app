<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1b4a6b" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231b4a6b'/><circle cx='13' cy='13' r='5' fill='%23ffd66b'/><path d='M9 22h13a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.2A3.4 3.4 0 0 0 9 22z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
  <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <title>Wetter — TVZA</title>
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=18" defer></script>

  <!-- ═══ Sky-blue product skin ═══ -->
  <style>
    body.wx {
      --accent:        #1b6fa8;
      --accent-hover:  #155a8a;
      --accent-bg:     rgba(27,111,168,.14);
      --wx-warm:       #e8893b;
      --wx-cold:       #4aa3df;
    }
    html[data-theme="dark"] body.wx { --wx-warm:#f0a35c; --wx-cold:#7cc3f0; }
    .wx .accent-bar--weather { background: linear-gradient(90deg,#123a57,#1b6fa8 55%,#5bb6e6); height:4px; }
    .wx .main { display:flex; flex-direction:column; gap:14px; }

    /* segmented control + search */
    .wx-seg { display:flex; gap:6px; }
    .wx-seg button { flex:1 1 0; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
      border-radius: var(--r-icon); min-height:38px; padding:6px 8px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:.15s; }
    .wx-seg button:hover { color:var(--accent); border-color:var(--accent); }
    .wx-seg button.active { background:var(--accent-bg); color:var(--accent); border-color:var(--accent); }
    .wx-find { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-top:10px; }
    .wx-loc-btn { white-space:nowrap; }
    .wx-quick { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:11px; }
    .wx-quick-label { color:var(--ink-soft); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .wx-chip { border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius: var(--r-pill); min-height:32px; padding:5px 11px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
    .wx-chip:hover { border-color:var(--accent); color:var(--accent); }
    .ac-wrap { position:relative; }

    /* current conditions hero */
    .wx-hero { position:relative; overflow:hidden; border:1px solid var(--border); border-radius:var(--r3);
      background:linear-gradient(160deg,#1b4a6b,#1b6fa8 60%,#3f93c7); color:#fff; padding:20px 18px 18px; min-height:150px; }
    html[data-theme="dark"] .wx-hero { background:linear-gradient(160deg,#0f2c41,#15527d 60%,#1d6796); }
    .wx-hero .sky-fx { position:absolute; inset:0; pointer-events:none; }
    .wx-hero .hero-top { position:relative; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .wx-place { font-size:14px; font-weight:700; opacity:.95; display:flex; align-items:center; gap:6px; }
    .wx-place small { font-weight:500; opacity:.8; }
    .wx-now { position:relative; z-index:2; display:flex; align-items:center; gap:14px; margin-top:6px; }
    .wx-temp { font-size:52px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
    .wx-cond { font-size:15px; font-weight:700; }
    .wx-feels { font-size:12.5px; opacity:.88; margin-top:2px; }
    .wx-icon-lg { width:74px; height:74px; flex-shrink:0; }
    .wx-metrics { position:relative; z-index:2; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
    .wx-metric { background:rgba(255,255,255,.13); border-radius: var(--r-icon); padding:8px 9px; min-width:0; }
    .wx-metric b { display:block; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
    .wx-metric span { display:block; font-size:10.5px; opacity:.85; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* hourly strip */
    .wx-card { border:1px solid var(--border); border-radius:var(--r2); background:var(--surface); padding:13px 14px; }
    .wx-card h2 { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 10px; }
    .wx-hours { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }
    .wx-hour { flex:0 0 auto; width:60px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;
      border-radius: var(--r-icon); padding:8px 4px; background:var(--surface-2); }
    .wx-hour .h-time { font-size:11px; color:var(--ink-soft); font-weight:700; }
    .wx-hour .h-ic { width:30px; height:30px; }
    .wx-hour .h-temp { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
    .wx-hour .h-pp { font-size:10px; color:var(--accent); font-weight:700; min-height:13px; }

    /* daily list */
    .wx-days { display:flex; flex-direction:column; gap:2px; }
    .wx-day { display:grid; grid-template-columns:minmax(70px,1fr) 34px minmax(80px,auto) minmax(74px,72px); gap:10px; align-items:center; padding:9px 2px; border-top:1px solid var(--border); }
    .wx-day:first-child { border-top:0; }
    .wx-day .d-name { font-size:13px; font-weight:700; }
    .wx-day .d-name small { display:block; color:var(--ink-soft); font-weight:500; font-size:11px; }
    .wx-day .d-ic { width:30px; height:30px; }
    .wx-day .d-extra { font-size:11px; color:var(--ink-soft); }
    .wx-day .d-temp { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
    .wx-day .d-temp b { font-weight:700; } .wx-day .d-temp span { color:var(--ink-soft); }

    /* mountain panel */
    .wx-alt-seg { display:flex; gap:6px; margin-bottom:12px; }
    .wx-alt-seg button { flex:1; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
      border-radius: var(--r-icon); min-height:48px; padding:5px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; line-height:1.25; }
    .wx-alt-seg button small { display:block; font-weight:500; font-size:10.5px; opacity:.8; }
    .wx-alt-seg button.active { background:var(--accent-bg); color:var(--accent); border-color:var(--accent); }
    .wx-snowcard { border-radius:var(--r2); padding:14px 15px; color:#fff; background:linear-gradient(150deg,#2a5f86,#5b93b8); }
    .wx-snowcard .sc-q { font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
    .wx-snowcard .sc-d { font-size:12.5px; opacity:.92; margin-top:5px; line-height:1.45; }
    .wx-grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
    .wx-fact { border:1px solid var(--border); border-radius: var(--r-icon); background:var(--surface-2); padding:10px 11px; }
    .wx-fact b { display:block; font-size:16px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
    .wx-fact span { display:block; font-size:11px; color:var(--ink-soft); margin-top:2px; }
    .wx-note { font-size:12px; color:var(--ink-soft); line-height:1.45; margin-top:10px; }

    .wx-msg { border:1px solid var(--border); background:var(--surface-2); border-radius:var(--r2); padding:14px; color:var(--ink-soft); font-size:13px; }
    .wx-meta { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 2px; font-size:12px; color:var(--ink-soft); }
    .wx-refresh { cursor:pointer; color:var(--accent); display:inline-flex; align-items:center; gap:5px; background:none; border:0; font:inherit; font-weight:700; padding:6px 4px; }
    .wx-refresh svg { transition:transform .5s ease; } .wx-refresh.spin svg { transform:rotate(360deg); }

    /* animated mini weather icons (shared) */
    .wic { display:block; overflow:visible; }
    .wic .sun-core { transform-origin:center; animation:wxSpin 22s linear infinite; }
    .wic .ray { transform-origin:center; animation:wxRays 3s ease-in-out infinite; }
    .wic .cloud { animation:wxDrift 5s ease-in-out infinite; }
    .wic .drop { animation:wxDrop 1.1s linear infinite; }
    .wic .flake2 { animation:wxFlake 2.4s linear infinite; transform-origin:center; }
    .wic .bolt { animation:wxBolt 2.6s steps(1) infinite; }
    @keyframes wxSpin { to { transform:rotate(360deg); } }
    @keyframes wxRays { 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
    @keyframes wxDrift { 0%,100%{ transform:translateX(-1.2px);} 50%{ transform:translateX(1.2px);} }
    @keyframes wxDrop { 0%{ transform:translateY(-2px); opacity:0;} 25%{opacity:1;} 100%{ transform:translateY(7px); opacity:0;} }
    @keyframes wxFlake { 0%{ transform:translateY(-2px) rotate(0); opacity:0;} 25%{opacity:1;} 100%{ transform:translateY(7px) rotate(180deg); opacity:0;} }
    @keyframes wxBolt { 0%,92%{ opacity:0;} 94%,98%{ opacity:1;} }
    @media (prefers-reduced-motion: reduce){ .wic * { animation:none!important; } }

    /* ═══ Weather-dependent entry splash ═══ */
    #wx-splash{ position:fixed; inset:0; z-index:99999; overflow:hidden; display:flex; align-items:center; justify-content:center;
      cursor:pointer; -webkit-tap-highlight-color:transparent; opacity:1; transition:opacity .55s ease, visibility .55s ease;
      background:linear-gradient(160deg,#1b4a6b,#1b6fa8 55%,#4a98cf); color:#fff; }
    #wx-splash.closing{ opacity:0; visibility:hidden; }
    /* Cross-fading background layers → theme changes morph instead of flashing */
    #wx-splash .wx-bg{ position:absolute; inset:0; z-index:0; opacity:0; transition:opacity .55s ease; will-change:opacity; }
    #wx-splash .stage{ z-index:3; }
    #wx-splash.theme-clear-day  { background:linear-gradient(160deg,#2879b8,#4aa3df 55%,#9fd4f2); }
    #wx-splash.theme-clear-night{ background:linear-gradient(165deg,#0a1430,#16294f 55%,#27406e); }
    #wx-splash.theme-cloud      { background:linear-gradient(160deg,#46586c,#6c7f93 60%,#9aa9b8); }
    #wx-splash.theme-fog        { background:linear-gradient(160deg,#5a6670,#88939c 60%,#b7bfc6); }
    #wx-splash.theme-rain       { background:linear-gradient(160deg,#2b3f52,#41617c 60%,#5d7e98); }
    #wx-splash.theme-snow       { background:linear-gradient(160deg,#516a82,#7fa0b9 55%,#cfe2ef); }
    #wx-splash.theme-storm      { background:linear-gradient(160deg,#1d2535,#33405a 55%,#4a5878); }
    #wx-splash .stage{ position:relative; text-align:center; padding:24px; z-index:3; }
    #wx-splash .scene{ width:min(300px,72vw); height:auto; display:block; margin:0 auto 16px; filter:drop-shadow(0 14px 30px rgba(0,0,0,.34)); }
    #wx-splash .mark{ font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:clamp(28px,8vw,48px); line-height:1;
      opacity:0; transform:translateY(14px) scale(.97); filter:blur(6px); animation:wxReveal .8s cubic-bezier(.22,.61,.36,1) .35s forwards; }
    #wx-splash .sub{ margin-top:11px; font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:clamp(11px,2.6vw,13px);
      letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.72); opacity:0; animation:wxFade .8s ease .8s forwards; min-height:14px; }
    #wx-splash .skip-hint{ position:absolute; bottom:max(26px,env(safe-area-inset-bottom)); left:0; right:0;
      display:block; width:auto; margin:0; padding:0; text-align:center; background:none; border:0; border-radius:0;
      font-family:'Hanken Grotesk',system-ui,sans-serif; font-size:9px; letter-spacing:.1em; color:rgba(255,255,255,.5); opacity:1; }
    /* splash scene primitives */
    #wx-splash .s-sun{ fill:#ffe08a; transform-origin:120px 86px; animation:wxSunIn 1s cubic-bezier(.2,.8,.3,1.2) .1s both; }
    #wx-splash.theme-clear-night .s-sun{ display:none; }
    #wx-splash .s-moon{ display:none; fill:#eef3ff; }
    #wx-splash.theme-clear-night .s-moon{ display:block; animation:wxSunIn 1s cubic-bezier(.2,.8,.3,1.2) .1s both; }
    #wx-splash .s-ray{ stroke:#ffe08a; stroke-width:5; stroke-linecap:round; transform-origin:120px 86px; animation:wxRayPulse 3s ease-in-out infinite, wxSunIn .9s ease .1s both; }
    #wx-splash:not(.theme-clear-day) .s-ray{ display:none; }
    #wx-splash .s-cloud{ fill:#fff; opacity:0; animation:wxCloudIn .9s cubic-bezier(.2,.7,.3,1) .25s forwards, wxCloudDrift 6s ease-in-out 1.1s infinite; }
    #wx-splash.theme-clear-day .s-cloud, #wx-splash.theme-clear-night .s-cloud{ display:none; }
    #wx-splash .s-cloud.c-dark{ fill:#dfe7ee; }
    #wx-splash .s-drop{ stroke:#bfe0f5; stroke-width:4; stroke-linecap:round; opacity:0; animation:wxRain 1.3s linear infinite; }
    #wx-splash:not(.theme-rain):not(.theme-storm) .s-drop{ display:none; }
    #wx-splash .s-flake{ fill:#fff; opacity:0; animation:wxSnowFall linear infinite; }
    #wx-splash:not(.theme-snow) .s-flake{ display:none; }
    #wx-splash .s-bolt{ fill:#ffe06b; opacity:0; }
    #wx-splash.theme-storm .s-bolt{ animation:wxBoltFlash 2.4s steps(1) 1s infinite; }
    #wx-splash:not(.theme-storm) .s-bolt{ display:none; }
    #wx-splash .s-fog{ stroke:#fff; stroke-width:6; stroke-linecap:round; opacity:0; animation:wxFogIn .8s ease .3s forwards, wxFogShift 5s ease-in-out 1s infinite; }
    #wx-splash:not(.theme-fog) .s-fog{ display:none; }
    @keyframes wxSunIn{ from{ transform:scale(.3); opacity:0;} to{ transform:scale(1); opacity:1;} }
    @keyframes wxRayPulse{ 0%,100%{ opacity:.5;} 50%{ opacity:1;} }
    @keyframes wxCloudIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
    @keyframes wxCloudDrift{ 0%,100%{ transform:translateX(-5px);} 50%{ transform:translateX(5px);} }
    @keyframes wxRain{ 0%{ transform:translateY(-6px); opacity:0;} 20%{opacity:.9;} 100%{ transform:translateY(20px); opacity:0;} }
    @keyframes wxSnowFall{ 0%{ transform:translateY(-6px); opacity:0;} 20%{opacity:1;} 100%{ transform:translateY(26px); opacity:0;} }
    @keyframes wxBoltFlash{ 0%,88%{ opacity:0;} 90%,94%{ opacity:1;} 96%{ opacity:.2;} 98%{ opacity:1;} }
    @keyframes wxFogIn{ to{ opacity:.85; } }
    @keyframes wxFogShift{ 0%,100%{ transform:translateX(-6px);} 50%{ transform:translateX(6px);} }
    @keyframes wxReveal{ to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0);} }
    @keyframes wxFade{ to{ opacity:1; } }
    @media (prefers-reduced-motion: reduce){
      #wx-splash .s-sun,#wx-splash .s-moon,#wx-splash .s-ray,#wx-splash .s-cloud,#wx-splash .s-drop,#wx-splash .s-flake,#wx-splash .s-bolt,#wx-splash .s-fog,
      #wx-splash .mark,#wx-splash .sub{ animation:none!important; opacity:1!important; transform:none!important; filter:none!important; }
    }
    @media (max-width:899px){
      .wx-metrics { grid-template-columns:repeat(2,1fr); }
      .wx-temp { font-size:46px; }
    }
  </style>
</head>
<body class="wx">

  <!-- ═══ Weather-dependent entry splash (plays every visit, tap to skip) ═══ -->
  <div id="wx-splash" role="dialog" aria-label="Wetter">
    <div class="wx-bg" id="wxBgA"></div>
    <div class="wx-bg" id="wxBgB"></div>
    <script>
    /* Paint the last-known weather theme BEFORE first paint so the splash never
       flashes the default blue before switching to today's condition. */
    (function(){
      try {
        var sp = document.getElementById('wx-splash'); if (!sp) return;
        var lk = JSON.parse(localStorage.getItem('tvza-weather-lastkind') || 'null'); if (!lk) return;
        var k = lk.kind, isDay = lk.isDay;
        var theme = (k==='clear') ? (isDay?'theme-clear-day':'theme-clear-night')
          : k==='fog'?'theme-fog' : k==='rain'?'theme-rain' : k==='snow'?'theme-snow' : k==='storm'?'theme-storm' : 'theme-cloud';
        var BG = {
          'theme-clear-day':'linear-gradient(160deg,#2879b8,#4aa3df 55%,#9fd4f2)',
          'theme-clear-night':'linear-gradient(165deg,#0a1430,#16294f 55%,#27406e)',
          'theme-cloud':'linear-gradient(160deg,#46586c,#6c7f93 60%,#9aa9b8)',
          'theme-fog':'linear-gradient(160deg,#5a6670,#88939c 60%,#b7bfc6)',
          'theme-rain':'linear-gradient(160deg,#2b3f52,#41617c 60%,#5d7e98)',
          'theme-snow':'linear-gradient(160deg,#516a82,#7fa0b9 55%,#cfe2ef)',
          'theme-storm':'linear-gradient(160deg,#1d2535,#33405a 55%,#4a5878)'
        };
        sp.classList.add(theme);
        var a = document.getElementById('wxBgA');
        if (a && BG[theme]) { a.style.transition = 'none'; a.style.backgroundImage = BG[theme]; a.style.opacity = '1'; }
        window.__wxPretheme = theme;
      } catch(e){}
    })();
    </script>
    <div class="stage">
      <svg class="scene" viewBox="0 0 240 170" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- sun / moon -->
        <circle class="s-sun" cx="120" cy="86" r="30"/>
        <path class="s-moon" d="M138 72a30 30 0 1 0 0 52 24 24 0 0 1 0-52z"/>
        <g>
          <line class="s-ray" x1="120" y1="30" x2="120" y2="44"/>
          <line class="s-ray" x1="120" y1="128" x2="120" y2="142"/>
          <line class="s-ray" x1="64"  y1="86"  x2="78"  y2="86"/>
          <line class="s-ray" x1="162" y1="86"  x2="176" y2="86"/>
          <line class="s-ray" x1="80"  y1="46"  x2="90"  y2="56"/>
          <line class="s-ray" x1="150" y1="116" x2="160" y2="126"/>
          <line class="s-ray" x1="160" y1="46"  x2="150" y2="56"/>
          <line class="s-ray" x1="90"  y1="116" x2="80"  y2="126"/>
        </g>
        <!-- fog bars -->
        <line class="s-fog" x1="60"  y1="78"  x2="180" y2="78"/>
        <line class="s-fog" x1="50"  y1="98"  x2="190" y2="98" style="animation-delay:.15s,1.4s"/>
        <line class="s-fog" x1="66"  y1="118" x2="174" y2="118" style="animation-delay:.3s,.7s"/>
        <!-- cloud -->
        <path class="s-cloud c-dark" d="M78 132a26 26 0 0 1 2-50 32 32 0 0 1 61 7 22 22 0 0 1 1 43z"/>
        <!-- rain -->
        <line class="s-drop" x1="86"  y1="138" x2="82"  y2="150"/>
        <line class="s-drop" x1="108" y1="138" x2="104" y2="150" style="animation-delay:.35s"/>
        <line class="s-drop" x1="130" y1="138" x2="126" y2="150" style="animation-delay:.7s"/>
        <line class="s-drop" x1="152" y1="138" x2="148" y2="150" style="animation-delay:.2s"/>
        <!-- snow -->
        <circle class="s-flake" cx="86"  cy="140" r="3.4" style="animation-duration:2.2s"/>
        <circle class="s-flake" cx="110" cy="140" r="2.8" style="animation-duration:2.7s;animation-delay:.5s"/>
        <circle class="s-flake" cx="134" cy="140" r="3.2" style="animation-duration:2.4s;animation-delay:.9s"/>
        <circle class="s-flake" cx="156" cy="140" r="2.6" style="animation-duration:2.9s;animation-delay:.3s"/>
        <!-- lightning -->
        <path class="s-bolt" d="M118 128 L104 150 L116 150 L108 168 L134 144 L120 144 L130 128 Z"/>
      </svg>
      <div class="mark">Wetter</div>
      <div class="sub" id="wxSplashSub">Standort wird ermittelt…</div>
    </div>
    <div class="skip-hint">Tippen zum Überspringen</div>
  </div>

  <div class="app">
    <div class="offline-banner" id="offlineBanner"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 11l-2 3H4l1 3 3 1 1-3 3-2 3.1 5.1a1 1 0 0 0 1.7-.9z"/></svg> Offline – Wetterdaten evtl. nicht aktuell</div>

    <header class="appbar appbar--bereich" data-bereich="weather">
      <div class="appbar__inner">
        <a href="../index.html" class="appbar__btn back-btn" aria-label="Zurück"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
        <span class="appbar__title">Wetter</span>
        <span class="appbar__end">
        <button class="appbar__btn" id="themeToggle" title="Theme wechseln"></button>
        </span>
      </div>
      <div class="appbar__accent"></div>
    </header>
    <div class="accent-bar accent-bar--weather"></div>

    <main class="main">

      <div class="form-card">
        <div class="wx-seg" id="modeSeg">
          <button type="button" data-mode="here" class="active">📍 Hier &amp; Region</button>
          <button type="button" data-mode="mountain">🏔️ Berg &amp; Schnee</button>
        </div>
        <div class="wx-find">
          <div class="ac-wrap">
            <input class="form-input" id="placeInput" type="text" placeholder="Ort suchen: Vaduz, Zermatt, Davos…" autocomplete="off" style="width:100%" />
            <div class="ac-list" id="acList"></div>
          </div>
          <button class="btn btn-secondary wx-loc-btn" id="geoBtn" title="Mein Standort">📍 Standort</button>
        </div>
        <div class="wx-quick" id="quickPicks"></div>
      </div>

      <div class="wx-meta">
        <span id="wxUpdated">—</span>
        <button class="wx-refresh" id="refreshBtn" title="Aktualisieren">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Aktualisieren
        </button>
      </div>

      <div id="content"><div class="spinner">Lade Wetter…</div></div>

    </main>

    <footer class="tvz-footer">
      <img src="../assets/icons/TvZ_Logo.svg" alt="TvZ" />
    </footer>
  </div>

  <script type="module">
    import { requireAuth, wireOfflineBanner, escHtml, reportClientError } from '../assets/js/firebase-config.js';

    wireOfflineBanner();
    await requireAuth('../login.html');

    const $ = id => document.getElementById(id);
    const LS_LOC = 'tvza-weather-loc';
    const LS_MODE = 'tvza-weather-mode';
    const LS_ALT  = 'tvza-weather-alt';

    /* ── Quick locations (Liechtenstein / Swiss focus) ── */
    const QUICK_HERE = [
      { name:'Vaduz',   admin1:'Liechtenstein', latitude:47.141, longitude:9.521, elevation:455 },
      { name:'Zürich',  admin1:'Zürich',        latitude:47.377, longitude:8.540, elevation:408 },
      { name:'Genf',    admin1:'Genf',          latitude:46.204, longitude:6.143, elevation:375 },
      { name:'Wien',    admin1:'Wien',          latitude:48.208, longitude:16.373, elevation:171 },
    ];
    const QUICK_MTN = [
      { name:'Malbun',      admin1:'Liechtenstein', latitude:47.103, longitude:9.609, elevation:1600, summit:2000 },
      { name:'Zermatt',     admin1:'Wallis',        latitude:46.020, longitude:7.749, elevation:1620, summit:3883 },
      { name:'Davos',       admin1:'Graubünden',    latitude:46.801, longitude:9.836, elevation:1560, summit:2844 },
      { name:'St. Moritz',  admin1:'Graubünden',    latitude:46.498, longitude:9.838, elevation:1822, summit:3303 },
      { name:'Verbier',     admin1:'Wallis',        latitude:46.096, longitude:7.228, elevation:1500, summit:3330 },
    ];

    /* ── WMO weather code → label / animated icon / splash theme ── */
    const WMO = {
      0:['Klar','clear'], 1:['Überwiegend klar','clear'], 2:['Teils bewölkt','cloud'], 3:['Bedeckt','overcast'],
      45:['Nebel','fog'], 48:['Reifnebel','fog'],
      51:['Leichter Niesel','rain'], 53:['Niesel','rain'], 55:['Starker Niesel','rain'],
      56:['Gefrierender Niesel','rain'], 57:['Gefrierender Niesel','rain'],
      61:['Leichter Regen','rain'], 63:['Regen','rain'], 65:['Starker Regen','rain'],
      66:['Gefrierender Regen','rain'], 67:['Gefrierender Regen','rain'],
      71:['Leichter Schneefall','snow'], 73:['Schneefall','snow'], 75:['Starker Schneefall','snow'], 77:['Schneegriesel','snow'],
      80:['Regenschauer','rain'], 81:['Regenschauer','rain'], 82:['Heftige Schauer','rain'],
      85:['Schneeschauer','snow'], 86:['Starke Schneeschauer','snow'],
      95:['Gewitter','storm'], 96:['Gewitter mit Hagel','storm'], 99:['Schweres Gewitter','storm'],
    };
    const codeInfo = c => WMO[c] || ['—','cloud'];

    // Animated SVG icon for a weather "kind" (clear/cloud/overcast/fog/rain/snow/storm)
    function iconSvg(kind, isDay = true, cls = 'wic', size = 30) {
      const S = `width="${size}" height="${size}" viewBox="0 0 50 50"`;
      const sun = isDay
        ? `<g class="sun-core"><circle cx="25" cy="25" r="9" fill="#ffcf4d"/></g>
           <g class="ray" stroke="#ffcf4d" stroke-width="2.6" stroke-linecap="round">
             <line x1="25" y1="5"  x2="25" y2="11"/><line x1="25" y1="39" x2="25" y2="45"/>
             <line x1="5"  y1="25" x2="11" y2="25"/><line x1="39" y1="25" x2="45" y2="25"/>
             <line x1="11" y1="11" x2="15" y2="15"/><line x1="35" y1="35" x2="39" y2="39"/>
             <line x1="39" y1="11" x2="35" y2="15"/><line x1="15" y1="35" x2="11" y2="39"/></g>`
        : `<path d="M32 14a13 13 0 1 0 4 22 11 11 0 0 1-4-22z" fill="#dfe7f5"/>`;
      const cloud = (fill) => `<path class="cloud" d="M16 38a8 8 0 0 1 .6-15.5 11 11 0 0 1 21 2.5 7 7 0 0 1 .4 13z" fill="${fill}"/>`;
      const drops = `<g class="drop" stroke="#5fa8e0" stroke-width="2.6" stroke-linecap="round">
          <line x1="19" y1="40" x2="17" y2="46"/><line x1="27" y1="40" x2="25" y2="46"/><line x1="35" y1="40" x2="33" y2="46"/></g>`;
      const flakes = `<g class="flake2" fill="#bcd9f0"><circle cx="19" cy="43" r="2"/><circle cx="27" cy="45" r="2"/><circle cx="35" cy="43" r="2"/></g>`;
      const bolt = `<path class="bolt" d="M27 36 L21 45 L26 45 L23 50 L33 41 L28 41 L31 36 Z" fill="#ffcf4d"/>`;
      let inner = '';
      if (kind === 'clear')      inner = sun;
      else if (kind === 'cloud') inner = (isDay ? `<g transform="translate(-4,-7) scale(.78)">${sun}</g>` : sun) + cloud('#ffffff');
      else if (kind === 'overcast') inner = cloud('#c9d3dc') + cloud('#eef2f6').replace('translate','t');
      else if (kind === 'fog')   inner = cloud('#dfe5ea') + `<g stroke="#aab4bd" stroke-width="2.4" stroke-linecap="round"><line x1="14" y1="42" x2="36" y2="42"/><line x1="17" y1="47" x2="33" y2="47"/></g>`;
      else if (kind === 'rain')  inner = cloud('#cdd6df') + drops;
      else if (kind === 'snow')  inner = cloud('#dbe4ec') + flakes;
      else if (kind === 'storm') inner = cloud('#9aa6b2') + bolt;
      else inner = cloud('#cdd6df');
      return `<svg class="${cls}" ${S} fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
    }
    // map kind → splash theme class
    function splashTheme(kind, isDay) {
      if (kind === 'clear') return isDay ? 'theme-clear-day' : 'theme-clear-night';
      if (kind === 'fog') return 'theme-fog';
      if (kind === 'rain') return 'theme-rain';
      if (kind === 'snow') return 'theme-snow';
      if (kind === 'storm') return 'theme-storm';
      return 'theme-cloud';
    }

    /* ════ State ════ */
    let mode = (() => { try { return localStorage.getItem(LS_MODE) || 'here'; } catch(e){ return 'here'; } })();
    if (mode !== 'mountain') mode = 'here';
    let altLevel = (() => { try { return localStorage.getItem(LS_ALT) || 'mid'; } catch(e){ return 'mid'; } })();
    let loc = loadLoc();
    let lastData = null;

    function loadLoc() {
      try { const v = JSON.parse(localStorage.getItem(LS_LOC) || 'null'); if (v && v.latitude != null) return v; } catch(e){}
      return { ...QUICK_HERE[0] };
    }
    function saveLoc(l) { try { localStorage.setItem(LS_LOC, JSON.stringify(l)); } catch(e){} }

    /* ════ Splash control (themed once weather kind known) ════ */
    const splash = $('wx-splash');
    let splashClosed = false, splashMin = Date.now() + 1400;
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    // Gradients mirror the CSS theme classes; applied to cross-fading layers so a
    // change from the cached guess to the real condition morphs instead of flashing.
    const SPLASH_BG = {
      'default'          : 'linear-gradient(160deg,#1b4a6b,#1b6fa8 55%,#4a98cf)',
      'theme-clear-day'  : 'linear-gradient(160deg,#2879b8,#4aa3df 55%,#9fd4f2)',
      'theme-clear-night': 'linear-gradient(165deg,#0a1430,#16294f 55%,#27406e)',
      'theme-cloud'      : 'linear-gradient(160deg,#46586c,#6c7f93 60%,#9aa9b8)',
      'theme-fog'        : 'linear-gradient(160deg,#5a6670,#88939c 60%,#b7bfc6)',
      'theme-rain'       : 'linear-gradient(160deg,#2b3f52,#41617c 60%,#5d7e98)',
      'theme-snow'       : 'linear-gradient(160deg,#516a82,#7fa0b9 55%,#cfe2ef)',
      'theme-storm'      : 'linear-gradient(160deg,#1d2535,#33405a 55%,#4a5878)',
    };
    const bgLayers = [$('wxBgA'), $('wxBgB')];
    // wxBgA may already hold the cached theme (painted instantly before first paint).
    let bgIdx = 0, bgCurKey = window.__wxPretheme || '';
    if (bgLayers[0]) { bgLayers[0].getBoundingClientRect(); bgLayers[0].style.transition = ''; }
    function setSplashBg(themeClass) {
      const key = SPLASH_BG[themeClass] ? themeClass : 'default';
      if (key === bgCurKey || !bgLayers[0] || !bgLayers[1]) return;
      bgCurKey = key;
      const next = bgLayers[bgIdx ^ 1], cur = bgLayers[bgIdx];
      next.style.backgroundImage = SPLASH_BG[key];
      next.getBoundingClientRect();   // force reflow so the opacity transition runs
      next.style.opacity = '1';
      cur.style.opacity = '0';
      bgIdx ^= 1;
    }
    function themeSplash(kind, isDay, label) {
      const theme = splashTheme(kind, isDay);
      splash.classList.remove('theme-clear-day','theme-clear-night','theme-cloud','theme-fog','theme-rain','theme-snow','theme-storm');
      splash.classList.add(theme);
      setSplashBg(theme);
      if (label) $('wxSplashSub').textContent = label;
    }
    function closeSplash() {
      if (splashClosed) return;
      const wait = Math.max(0, splashMin - Date.now());
      setTimeout(() => {
        if (splashClosed) return; splashClosed = true;
        splash.classList.add('closing'); setTimeout(() => splash.remove(), 560);
      }, wait);
    }
    splash.addEventListener('click', () => { splashClosed = true; splash.classList.add('closing'); setTimeout(() => splash.remove(), 560); });
    document.documentElement.style.overflow = 'hidden';
    setTimeout(() => { document.documentElement.style.overflow = ''; }, 600);
    // hard safety: never trap the user
    setTimeout(() => { if (!splashClosed) { splashClosed = true; splash.classList.add('closing'); setTimeout(()=>splash.remove(),560); } }, reduce ? 1400 : 4200);
    // pre-theme from last known condition for an instant themed feel
    try { const lk = JSON.parse(localStorage.getItem('tvza-weather-lastkind') || 'null'); if (lk) themeSplash(lk.kind, lk.isDay, null); } catch(e){}

    /* ════ Open-Meteo fetch ════ */
    async function getJson(url, tries = 2) {
      let lastErr;
      for (let i = 0; i < tries; i++) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return await r.json();
        } catch (e) { lastErr = e; if (i < tries - 1) await new Promise(res => setTimeout(res, 450)); }
      }
      throw lastErr;
    }
    async function geocode(q) {
      try {
        const j = await getJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=de&format=json`);
        return (j.results || []).map(r => ({
          name:r.name, admin1:r.admin1 || r.country || '', country:r.country || '',
          latitude:r.latitude, longitude:r.longitude, elevation:r.elevation
        }));
      } catch(e){ return []; }
    }
    async function reverseName(lat, lon) {
      try {
        const j = await getJson(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=de`);
        return { name: j.city || j.locality || j.principalSubdivision || 'Mein Standort',
                 admin1: j.principalSubdivision || j.countryName || '' };
      } catch(e){ return { name:'Mein Standort', admin1:'' }; }
    }
    async function fetchWeather(l, elevationOverride) {
      const base = {
        latitude: l.latitude, longitude: l.longitude,
        current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day,precipitation',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,snowfall_sum,sunrise,sunset',
        timezone: 'auto', forecast_days: '7', wind_speed_unit: 'kmh'
      };
      // Full request includes the mountain extras; if the API rejects those, fall back to a lean request.
      const full = { ...base, hourly: 'temperature_2m,weather_code,precipitation_probability,snowfall,snow_depth,freezing_level_height' };
      const lite = { ...base, hourly: 'temperature_2m,weather_code,precipitation_probability,snowfall' };
      const build = obj => {
        const p = new URLSearchParams(obj);
        if (elevationOverride != null) p.set('elevation', Math.round(elevationOverride));
        return 'https://api.open-meteo.com/v1/forecast?' + p.toString();
      };
      try { return await getJson(build(full)); }
      catch (e) { return await getJson(build(lite)); }
    }

    /* ════ Formatting helpers ════ */
    const tC = n => (n == null || isNaN(n)) ? '—' : Math.round(n) + '°';
    const tC1 = n => (n == null || isNaN(n)) ? '—' : (Math.round(n*10)/10).toLocaleString('de-CH') + '°';
    const dayName = (iso, i) => {
      if (i === 0) return 'Heute';
      const d = new Date(iso + 'T00:00');
      return d.toLocaleDateString('de-CH', { weekday:'short' });
    };
    const hourLabel = iso => new Date(iso).toLocaleTimeString('de-CH', { hour:'2-digit' }) + 'h';
    const clock = iso => new Date(iso).toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' });

    /* ════ Renderers ════ */
    function renderHere(data, l) {
      const c = data.current, isDay = c.is_day === 1;
      const [label, kind] = codeInfo(c.weather_code);
      const d = data.daily;
      const todayMax = d.temperature_2m_max?.[0], todayMin = d.temperature_2m_min?.[0];

      // hero
      let html = `
        <div class="wx-hero">
          <div class="sky-fx"></div>
          <div class="hero-top">
            <div class="wx-place">📍 ${escHtml(l.name)}${l.admin1 ? ` <small>· ${escHtml(l.admin1)}</small>` : ''}</div>
          </div>
          <div class="wx-now">
            ${iconSvg(kind, isDay, 'wic wx-icon-lg', 74)}
            <div>
              <div class="wx-temp">${tC(c.temperature_2m)}</div>
              <div class="wx-cond">${escHtml(label)}</div>
              <div class="wx-feels">Gefühlt ${tC(c.apparent_temperature)} · H ${tC(todayMax)} / T ${tC(todayMin)}</div>
            </div>
          </div>
          <div class="wx-metrics">
            <div class="wx-metric"><b>${Math.round(c.wind_speed_10m)} km/h</b><span>Wind</span></div>
            <div class="wx-metric"><b>${Math.round(c.relative_humidity_2m)}%</b><span>Luftfeuchte</span></div>
            <div class="wx-metric"><b>${clock(d.sunrise?.[0])}</b><span>☀ Aufgang</span></div>
            <div class="wx-metric"><b>${clock(d.sunset?.[0])}</b><span>☾ Untergang</span></div>
          </div>
        </div>`;

      // hourly (next 12h from now)
      const now = Date.now();
      const hi = data.hourly.time.findIndex(t => new Date(t).getTime() >= now - 3600000);
      const start = hi < 0 ? 0 : hi;
      let hours = '';
      for (let i = start; i < Math.min(start + 12, data.hourly.time.length); i++) {
        const [, hk] = codeInfo(data.hourly.weather_code[i]);
        const pp = data.hourly.precipitation_probability?.[i];
        const dayH = (() => { const h = new Date(data.hourly.time[i]).getHours(); return h >= 7 && h < 20; })();
        hours += `<div class="wx-hour">
          <span class="h-time">${i === start ? 'Jetzt' : hourLabel(data.hourly.time[i])}</span>
          ${iconSvg(hk, dayH, 'wic h-ic', 30)}
          <span class="h-temp">${tC(data.hourly.temperature_2m[i])}</span>
          <span class="h-pp">${pp != null && pp > 0 ? '💧'+pp+'%' : ''}</span>
        </div>`;
      }
      html += `<div class="wx-card"><h2>Stündlich</h2><div class="wx-hours">${hours}</div></div>`;

      // daily (7d)
      let days = '';
      for (let i = 0; i < d.time.length; i++) {
        const [dlabel, dk] = codeInfo(d.weather_code[i]);
        const snow = d.snowfall_sum?.[i];
        const pp = d.precipitation_probability_max?.[i];
        const extra = (snow && snow > 0.1) ? `❄ ${snow.toLocaleString('de-CH',{maximumFractionDigits:1})} cm`
                    : (pp != null && pp > 0) ? `💧 ${pp}%` : '';
        days += `<div class="wx-day">
          <div class="d-name">${dayName(d.time[i], i)}<small>${escHtml(dlabel)}</small></div>
          ${iconSvg(dk, true, 'wic d-ic', 30)}
          <div class="d-extra">${extra}</div>
          <div class="d-temp"><b>${tC(d.temperature_2m_max[i])}</b> <span>${tC(d.temperature_2m_min[i])}</span></div>
        </div>`;
      }
      html += `<div class="wx-card"><h2>7-Tage</h2><div class="wx-days">${days}</div></div>`;

      $('content').innerHTML = html;
    }

    /* mountain: temperature at altitude, freezing level, snow */
    function altMeta(l) {
      const base = l.elevation || 1500;
      const summit = l.summit || (base + 1400);
      const mid = Math.round((base + summit) / 2 / 50) * 50;
      return {
        valley: { h: Math.round(base), label:'Tal' },
        mid:    { h: mid,             label:'Mittelstation' },
        summit: { h: Math.round(summit), label:'Gipfel' },
      };
    }
    function snowQuality(tempAtAlt, freezeH, altH, snow24, snowDepth) {
      // interpret "how warm/cold the snow is" from air temp at altitude + freezing level
      const t = tempAtAlt;
      let q, emoji, desc;
      if (t == null) { q = 'Unbekannt'; emoji='❔'; desc='Keine Höhendaten verfügbar.'; }
      else if (t <= -8)  { q='Eiskalt · Pulver'; emoji='❄️'; desc='Sehr kalter, trockener Pulverschnee. Bleibt lange locker und griffig.'; }
      else if (t <= -3)  { q='Kalt · Pulver';   emoji='🌨️'; desc='Kalter, trockener Schnee — gute, beständige Pulverbedingungen.'; }
      else if (t < 0)    { q='Frisch · griffig'; emoji='⛄'; desc='Knapp unter null: griffiger, gut gebundener Schnee. Morgens oft hart.'; }
      else if (t < 2)    { q='Weich · Firn';     emoji='🌤️'; desc='Um den Gefrierpunkt: Oberfläche wird weich/sulzig, nachts gefriert sie wieder (Firn).'; }
      else               { q='Nass · Sulz';      emoji='💧'; desc='Über null: nasser, schwerer Sulzschnee. Schmilzt, vor allem nachmittags.'; }
      if (t != null && freezeH != null) {
        if (freezeH > altH + 100) desc += ` Nullgradgrenze (${Math.round(freezeH)} m) liegt über dieser Höhe — es taut.`;
        else if (freezeH < altH - 100) desc += ` Nullgradgrenze (${Math.round(freezeH)} m) liegt darunter — Schnee bleibt kalt.`;
      }
      return { q, emoji, desc };
    }
    async function renderMountain(l) {
      const am = altMeta(l);
      const lvl = am[altLevel] || am.mid;
      // fetch downscaled to the chosen altitude
      const data = await fetchWeather(l, lvl.h);
      lastData = data;
      const c = data.current, isDay = c.is_day === 1;
      const [label, kind] = codeInfo(c.weather_code);
      const d = data.daily;

      // current freezing level + snow depth (nearest hour)
      const now = Date.now();
      let hi = data.hourly.time.findIndex(t => new Date(t).getTime() >= now - 3600000);
      if (hi < 0) hi = 0;
      const freezeH = data.hourly.freezing_level_height?.[hi];
      const snowDepthM = data.hourly.snow_depth?.[hi];
      const snowDepthCm = snowDepthM != null ? snowDepthM * 100 : null;
      // snowfall next 24h & 3d
      let snow24 = 0, snow3d = 0;
      for (let i = 0; i < (d.snowfall_sum?.length || 0); i++) { if (i === 0) snow24 += d.snowfall_sum[i] || 0; if (i < 3) snow3d += d.snowfall_sum[i] || 0; }

      const sq = snowQuality(c.temperature_2m, freezeH, lvl.h, snow24, snowDepthCm);

      // altitude selector
      const altBtns = ['valley','mid','summit'].map(k =>
        `<button type="button" data-alt="${k}" class="${k===altLevel?'active':''}">${am[k].label}<small>${am[k].h} m</small></button>`).join('');

      let html = `
        <div class="wx-hero">
          <div class="hero-top">
            <div class="wx-place">🏔️ ${escHtml(l.name)}${l.admin1 ? ` <small>· ${escHtml(l.admin1)}</small>` : ''}</div>
          </div>
          <div class="wx-now">
            ${iconSvg(kind, isDay, 'wic wx-icon-lg', 74)}
            <div>
              <div class="wx-temp">${tC(c.temperature_2m)}</div>
              <div class="wx-cond">${escHtml(label)}</div>
              <div class="wx-feels">auf ${lvl.h} m (${lvl.label}) · gefühlt ${tC(c.apparent_temperature)}</div>
            </div>
          </div>
        </div>

        <div class="wx-card">
          <h2>Höhe wählen</h2>
          <div class="wx-alt-seg" id="altSeg">${altBtns}</div>
          <div class="wx-snowcard">
            <div class="sc-q">${sq.emoji} ${escHtml(sq.q)}</div>
            <div class="sc-d">${escHtml(sq.desc)}</div>
          </div>
          <div class="wx-grid2">
            <div class="wx-fact"><b>${tC1(c.temperature_2m)}</b><span>Lufttemperatur auf ${lvl.h} m</span></div>
            <div class="wx-fact"><b>${freezeH != null ? Math.round(freezeH)+' m' : '—'}</b><span>Nullgradgrenze</span></div>
            <div class="wx-fact"><b>${snowDepthCm != null ? Math.round(snowDepthCm)+' cm' : '—'}</b><span>Schneehöhe (Modell)</span></div>
            <div class="wx-fact"><b>${snow24 > 0.05 ? snow24.toLocaleString('de-CH',{maximumFractionDigits:1})+' cm' : '0 cm'}</b><span>Neuschnee heute</span></div>
          </div>
          <p class="wx-note">„Wie warm der Schnee ist" wird aus der Lufttemperatur auf dieser Höhe und der Nullgradgrenze abgeleitet — eine gute Näherung für die Schneeoberfläche. Schneehöhe ist ein Modellwert und kann von Pisten­messungen abweichen.</p>
        </div>`;

      // snow/temperature over next days at altitude
      let days = '';
      for (let i = 0; i < d.time.length; i++) {
        const [dlabel, dk] = codeInfo(d.weather_code[i]);
        const snow = d.snowfall_sum?.[i] || 0;
        const extra = snow > 0.1 ? `❄ ${snow.toLocaleString('de-CH',{maximumFractionDigits:1})} cm` : (d.precipitation_probability_max?.[i] ? `💧 ${d.precipitation_probability_max[i]}%` : '');
        days += `<div class="wx-day">
          <div class="d-name">${dayName(d.time[i], i)}<small>${escHtml(dlabel)}</small></div>
          ${iconSvg(dk, true, 'wic d-ic', 30)}
          <div class="d-extra">${extra}</div>
          <div class="d-temp"><b>${tC(d.temperature_2m_max[i])}</b> <span>${tC(d.temperature_2m_min[i])}</span></div>
        </div>`;
      }
      html += `<div class="wx-card"><h2>Berg-Prognose 7-Tage (${lvl.h} m)</h2><div class="wx-days">${days}</div></div>`;

      $('content').innerHTML = html;
      $('altSeg').querySelectorAll('[data-alt]').forEach(b => b.addEventListener('click', () => {
        altLevel = b.dataset.alt; try { localStorage.setItem(LS_ALT, altLevel); } catch(e){}
        load();
      }));
    }

    /* ════ Orchestration ════ */
    let loadSeq = 0;
    async function load() {
      const seq = ++loadSeq;
      $('refreshBtn').classList.add('spin');
      try {
        if (mode === 'mountain') {
          await renderMountain(loc);
          if (seq !== loadSeq) return;
        } else {
          const data = await fetchWeather(loc);
          if (seq !== loadSeq) return;
          lastData = data;
          renderHere(data, loc);
        }
        // theme the splash from real data + remember for next time
        const c = lastData?.current;
        if (c) {
          const [lab, kind] = codeInfo(c.weather_code);
          const isDay = c.is_day === 1;
          themeSplash(kind, isDay, `${loc.name} · ${tC(c.temperature_2m)} · ${lab}`);
          try { localStorage.setItem('tvza-weather-lastkind', JSON.stringify({ kind, isDay })); } catch(e){}
        }
        closeSplash();
        $('wxUpdated').textContent = 'Stand: ' + new Date().toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' });
      } catch (e) {
        reportClientError('weather-load', e);
        if (seq === loadSeq) {
          if (lastData) {
            // Already showing a forecast — don't wipe it just because a refresh hiccuped.
            $('wxUpdated').textContent = 'Aktualisierung fehlgeschlagen — letzter Stand bleibt sichtbar';
          } else {
            $('content').innerHTML = `<div class="wx-msg">Wetterdaten konnten nicht geladen werden. Bist du online?<br><button class="btn btn-secondary" id="wxRetry" style="margin-top:10px">Nochmal versuchen</button></div>`;
            document.getElementById('wxRetry')?.addEventListener('click', load);
          }
        }
        closeSplash();
      } finally {
        if (seq === loadSeq) setTimeout(() => $('refreshBtn').classList.remove('spin'), 500);
      }
    }

    /* ════ Mode toggle ════ */
    function setMode(m) {
      mode = (m === 'mountain') ? 'mountain' : 'here';
      try { localStorage.setItem(LS_MODE, mode); } catch(e){}
      $('modeSeg').querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      $('placeInput').placeholder = mode === 'mountain' ? 'Bergort suchen: Zermatt, Davos…' : 'Ort suchen: Vaduz, Zürich…';
      // if switching to mountain and current loc has no summit, pick a default mountain
      if (mode === 'mountain' && loc.summit == null) { loc = { ...QUICK_MTN[0] }; saveLoc(loc); }
      renderQuick();
      load();
    }
    $('modeSeg').querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

    /* ════ Quick picks ════ */
    function renderQuick() {
      const wrap = $('quickPicks');
      const picks = mode === 'mountain' ? QUICK_MTN : QUICK_HERE;
      wrap.innerHTML = `<span class="wx-quick-label">Schnell</span>` +
        picks.map((p, i) => `<button class="wx-chip" type="button" data-q="${i}">${escHtml(p.name)}</button>`).join('');
      wrap.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
        loc = { ...picks[+b.dataset.q] }; saveLoc(loc); load();
      }));
    }

    /* ════ Search (geocoding) ════ */
    const acList = $('acList'), placeInput = $('placeInput');
    let acTimer = null, acSeq = 0, acResults = [];
    function hideAc() { acList.classList.remove('visible'); acList.innerHTML = ''; acResults = []; }
    placeInput.addEventListener('input', () => {
      clearTimeout(acTimer);
      const q = placeInput.value.trim();
      if (q.length < 2) { hideAc(); return; }
      acList.innerHTML = `<div class="ac-item" style="opacity:.6">Suche…</div>`; acList.classList.add('visible');
      acTimer = setTimeout(async () => {
        const seq = ++acSeq; const res = await geocode(q);
        if (seq !== acSeq) return;
        acResults = res;
        if (!res.length) { acList.innerHTML = `<div class="ac-item" style="opacity:.6">Keine Treffer</div>`; return; }
        acList.classList.add('visible');
        acList.innerHTML = res.map((r, i) => `<div class="ac-item" data-idx="${i}"><strong>${escHtml(r.name)}</strong> <small>${escHtml(r.admin1 || r.country || '')}</small></div>`).join('');
        acList.querySelectorAll('.ac-item[data-idx]').forEach(el => el.addEventListener('mousedown', e => {
          e.preventDefault(); pickPlace(res[+el.dataset.idx]);
        }));
      }, 280);
    });
    placeInput.addEventListener('blur', () => setTimeout(hideAc, 180));
    placeInput.addEventListener('keydown', e => { if (e.key === 'Enter' && acResults[0]) { e.preventDefault(); pickPlace(acResults[0]); } });
    function pickPlace(r) {
      loc = { name:r.name, admin1:r.admin1 || r.country || '', latitude:r.latitude, longitude:r.longitude, elevation:r.elevation };
      if (mode === 'mountain' && r.elevation) loc.summit = Math.round(r.elevation + 1200);
      placeInput.value = ''; hideAc(); saveLoc(loc); load();
    }

    /* ════ Geolocation ════ */
    $('geoBtn').addEventListener('click', useMyLocation);
    function useMyLocation() {
      if (!navigator.geolocation) { alert('Standort wird von diesem Gerät nicht unterstützt.'); return; }
      $('geoBtn').textContent = '…';
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude, longitude } = pos.coords;
        const nm = await reverseName(latitude, longitude);
        loc = { name:nm.name, admin1:nm.admin1, latitude, longitude, elevation:pos.coords.altitude || null };
        if (mode === 'mountain') loc.summit = Math.round((loc.elevation || 1500) + 1200);
        saveLoc(loc); $('geoBtn').textContent = '📍 Standort'; load();
      }, err => {
        $('geoBtn').textContent = '📍 Standort';
        alert('Standort nicht verfügbar. Bitte einen Ort suchen.');
      }, { enableHighAccuracy:false, timeout:8000, maximumAge:600000 });
    }

    /* ════ Refresh + init ════ */
    $('refreshBtn').addEventListener('click', load);
    setInterval(() => { if (!document.hidden) load(); }, 600000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

    // initial sub for splash
    $('wxSplashSub').textContent = loc.name ? `${loc.name} wird geladen…` : 'Standort wird ermittelt…';
    $('modeSeg').querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    if (mode === 'mountain') $('placeInput').placeholder = 'Bergort suchen: Zermatt, Davos…';
    renderQuick();

    // On very first visit (no saved location) try geolocation silently, else use default.
    let hadSaved = false;
    try { hadSaved = !!localStorage.getItem(LS_LOC); } catch(e){}
    if (!hadSaved && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude, longitude } = pos.coords;
        const nm = await reverseName(latitude, longitude);
        loc = { name:nm.name, admin1:nm.admin1, latitude, longitude, elevation:pos.coords.altitude || null };
        if (mode === 'mountain') { loc = { ...QUICK_MTN[0] }; }
        saveLoc(loc); load();
      }, () => { load(); }, { enableHighAccuracy:false, timeout:7000, maximumAge:600000 });
    } else {
      load();
    }
  </script>
  <script type="module" src="../assets/js/nav.js"></script>
</body>
