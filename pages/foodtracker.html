<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1A1A2E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/kit.css?v=39" />
  <link rel="stylesheet" href="../assets/css/legacy.css?v=1" />
  <link rel="stylesheet" href="../assets/css/feature/food.css?v=2" />
  <title>Food Tracker — TVZA</title>
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=35" defer></script>
  <style>
    /* Top bar flush to the very top — also on mobile / installed PWA.
       The shared rule stacks the header into a column on phones; the
       Food-Tracker bar should stay a single flush row that paints into
       the status-bar safe area. */
    .header { padding-top: env(safe-area-inset-top, 0px); }
    @media (max-width: 899px) {
      .header-inner .back-btn { flex: 0 0 auto; }
    }
    /* Quick-amount buttons: comfy tap targets */
    #amountBtns .btn { padding: 13px 14px; font-size: 15px; align-items: center; }
    /* Live "added so far" list inside the scanner */
    .scan-summary { margin: 10px 0 4px; }
    .scan-summary .ss-item { display:flex; justify-content:space-between; gap:10px;
      font-size:13px; padding:6px 10px; border-radius: var(--r-icon); background:var(--surface-2); margin-bottom:6px; }
    .scan-summary .ss-item small { color:var(--ink-soft); }
    /* Lightweight toast */
    #toast { position: fixed; left: 50%; bottom: calc(20px + 64px + env(safe-area-inset-bottom,0px));
      transform: translateX(-50%) translateY(8px); background: var(--food, #2F9E44); color:#fff;
      padding: 10px 16px; border-radius: var(--r-pill); font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity .18s ease, transform .18s ease; z-index: 1000; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* Entry cards: tap to edit affordance */
    .item-card .item-content { cursor: pointer; }
  </style>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/tvza.svg" />
  <link rel="apple-touch-icon" href="../assets/icons/tvza-192.png" />
</head>
<body data-marke="TVZA">
  <div class="app">

    <div class="offline-banner" id="offlineBanner"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 11l-2 3H4l1 3 3 1 1-3 3-2 3.1 5.1a1 1 0 0 0 1.7-.9z"/></svg> Offline – wird später synchronisiert</div>

    <header class="appbar appbar--bereich" data-bereich="food">
      <div class="appbar__inner">
        <a href="../index.html" class="appbar__btn back-btn" aria-label="Zurück" data-i18n-attr="aria-label:a11y.zurueck"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
        <span class="tvza-marke" title="Persönlicher Bereich" data-i18n-attr="title:home.persoenlichBereich">TVZA</span>
        <span class="appbar__title" data-i18n="mod.food.name">Food Tracker</span>
        <span class="appbar__end">
        <button class="appbar__btn" id="themeToggle" title="Theme wechseln" data-i18n-attr="title:pg.theme"></button>
        </span>
      </div>
      <div class="appbar__accent"></div>
    </header>
    <div class="accent-bar accent-bar--food"></div>

    <main class="main">

      <div class="tabs">
        <div class="tab active" id="tabDay"   onclick="showView('day')"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Tag</div>
        <div class="tab"        id="tabMonth" onclick="showView('month')" data-i18n="fd.monat">🗓 Monat</div>
      </div>

      <!-- ═══ Day view ═══ -->
      <div id="viewDay">

        <!-- Daily kcal progress -->
        <div class="form-card" id="kcalCard" style="display:none">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
            <strong id="kcalToday">0 kcal</strong>
            <span style="color:var(--ink-soft)" id="kcalGoal"></span>
          </div>
          <div class="kcal-bar"><div class="kcal-fill" id="kcalFill" style="width:0%"></div></div>
        </div>

        <!-- Date navigation -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
          <button class="date-pill" onclick="changeDay(-1)">‹</button>
          <div class="date-pill" style="flex:1;justify-content:center;" id="datePill" data-i18n="home.heute">Heute</div>
          <button class="date-pill" onclick="changeDay(1)">›</button>
        </div>

        <!-- Entry form -->
        <div class="form-card" id="entryCard">
          <p class="form-title" id="formTitle" data-i18n="fd.erfassen">Mahlzeit erfassen</p>

          <div class="form-group">
            <label class="form-label" for="fMeal" data-i18n="fd.mahlzeit">Mahlzeit</label>
            <select class="form-select" id="fMeal">
              <option data-i18n="fd.fruehstueck">🌅 Frühstück</option>
              <option data-i18n="fd.mittag">☀️ Mittagessen</option>
              <option data-i18n="fd.abend">🌙 Abendessen</option>
              <option data-i18n="fd.snack">🍎 Snack</option>
            </select>
          </div>

          <label class="form-label" data-i18n="fd.zutaten">Zutaten (ungefähres Gewicht)</label>
          <div id="fdErfassung"></div>

          <button class="btn btn-primary btn-block" id="saveBtn" data-i18n="fd.speichern">✓ Speichern</button>
          <button class="btn btn-secondary btn-block" id="cancelEditBtn" style="display:none;margin-top:8px" data-i18n="common.abbrechen">Abbrechen</button>
        </div>

        <!-- Entries -->
        <h2 class="section-title" id="dayLabel" data-i18n="fd.eintraegeHeute">Heutige Einträge</h2>
        <div id="listWrap"><div class="spinner" data-i18n="common.laden">Lade…</div></div>

      </div>

      <!-- ═══ Month view ═══ -->
      <div id="viewMonth" style="display:none">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
          <button class="date-pill" onclick="changeMonth(-1)">‹</button>
          <div class="date-pill" style="flex:1;justify-content:center;" id="monthPill"></div>
          <button class="date-pill" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <p style="font-size:11px;color:var(--ink-soft);margin-top:10px;text-align:center" data-i18n="fd.tippeTag">
          Tippe auf einen Tag, um die Einträge zu sehen
        </p>
      </div>

    </main>

    <footer class="tvz-footer">
      <span class="firn">Fir<b>n</b></span>
    </footer>
  </div>

  <div id="toast"></div>

  <!-- Request food modal -->
  <div class="modal-backdrop" id="reqModal">
    <div class="modal">
      <div class="modal-title" data-i18n="fd.vorschlagen">Lebensmittel vorschlagen</div>
      <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0 14px" data-i18n="fd.vorschlagenSub">
        Nicht gefunden? Schlag es vor — sobald es freigegeben ist, steht es allen zur Verfügung.
      </p>
      <div class="form-group">
        <label class="form-label" for="reqName" data-i18n="common.name">Name</label>
        <input class="form-input" id="reqName" type="text" placeholder="z.B. Skyr Vanille" data-i18n-attr="placeholder:fd.beispielName" />
      </div>
      <div class="form-group">
        <label class="form-label" for="reqNote" data-i18n="fd.notiz">Notiz</label>
        <input class="form-input" id="reqNote" type="text" placeholder="Marke, Packungsgrösse, Geschmack …" data-i18n-attr="placeholder:fd.beispielMarke" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="reqCancel" data-i18n="common.abbrechen">Abbrechen</button>
        <button class="btn btn-primary" id="reqSend" data-i18n="fd.vorschlagSenden">Vorschlag senden</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, requireAuth, wireOfflineBanner, escHtml, sharesForEmail, reportClientError } from '../assets/js/firebase-config.js';
    import { registerFoods } from '../assets/js/foods.js';
    /* Die Erfassung ist geteilter Code (v.35.72.0): dieselbe Rechnung,
       dasselbe Mengenblatt, derselbe Scanner wie im Kader. */
    import { erfassungMontieren } from '../assets/js/feature/essen/erfassung.js';
    import { frage, meldung } from '../assets/js/dialog.js';

    /* Falle 5: t() gibt bei unbekanntem Schluessel den Schluessel
       zurueck, nie undefined — also tOr und nie ??. */
    const tOrDe = (key, de, vars) => window.TVZAI18n?.tOr(key, de, vars) ?? de;
    import {
      doc, getDoc, setDoc, collection, addDoc, onSnapshot, updateDoc,
      deleteDoc, serverTimestamp, Timestamp, query, where, orderBy, getDocs
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    wireOfflineBanner();
    const user = await requireAuth('../login.html');

    // ── Zugriff: eigene Daten, oder per Freigabe (?owner=…) ──
    let dataUid = user.uid;
    let readOnly = false;
    let ownerLabel = '';
    const ownerParam = new URLSearchParams(location.search).get('owner');
    if (ownerParam && ownerParam !== user.uid) {
      const shares = await sharesForEmail(user.email);
      const s = shares.find(x => x.ownerUid === ownerParam && x.module === 'food');
      if (s) { dataUid = ownerParam; readOnly = s.role !== 'edit'; ownerLabel = s.ownerName || 'geteilt'; }
      else {
        await meldung({ titel: tOrDe('fd.keinZugriff', 'Kein Zugriff auf diese Freigabe.') });
        if (!window.tvzaNavigate?.('../index.html')) window.location.href = '../index.html';
      }
    }
    if (dataUid !== user.uid) {
      document.querySelector('.page-title').textContent =
        (ownerLabel ? ownerLabel + 's' : 'Geteilter') + ' Food Tracker';
      const note = document.createElement('div');
      note.className = 'offline-banner visible';
      note.style.background = 'var(--food)';
      note.textContent = readOnly ? `👀 Leseansicht — ${ownerLabel || 'geteilte'} Daten` : `✏️ Bearbeiten — ${ownerLabel || 'geteilte'} Daten`;
      document.querySelector('.accent-bar').after(note);
    }

    const entriesCol = collection(db, 'foodlog', dataUid, 'entries');
    const profileRef = doc(db, 'foodlog', dataUid, 'meta', 'profile');

    if (readOnly) {
      const sb = document.getElementById('saveBtn');
      if (sb) sb.closest('.form-card').style.display = 'none';
    }

    /* ── Icon chrome (SVG) ── */
    const ICON_CLOSE = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    const ICON_FOOD = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>`;

    /* ════ Zutaten erfassen ══════════════════════
       Seit v.35.72.0 nicht mehr hier: Zutatenzeilen, Vervollstaendigung,
       Naehrwertrechnung, Mengenblatt und Scanner stehen in
       feature/essen/erfassung.js — dieselbe Erfassung benutzt die
       Gruppe (Falle: zwei Rechner waeren zwei Rundungen). */
    const erfassung = erfassungMontieren(document.getElementById('fdErfassung'), {
      onVorschlag: (name, extra) => openRequest(name, { barcode: extra?.barcode || '', brand: extra?.marke || '' }),
      onFertig: () => { void saveCurrentMeal(); },
    });

    /* ════ Profile ═══════════════════════════════ */
    let profile = null;
    try {
      const s = await getDoc(profileRef);
      if (s.exists()) profile = s.data();
    } catch(e){}

    function kcalTarget() {
      if (!profile?.weight) return null;
      let base = profile.weight * 30; // rough maintenance estimate
      if (profile.goal === 'abnehmen') base -= 300;
      if (profile.goal === 'zunehmen') base += 300;
      return Math.round(base / 10) * 10;
    }


    /* ════ Day view ═════════════════════════════ */
    let offset = 0;
    let unsubDay = null;
    let dayEntries = [];

    const toDateStr = d => {
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${dd}`;
    };
    const currentDate = () => { const d = new Date(); d.setDate(d.getDate()+offset); return d; };

    window.changeDay = delta => { offset += delta; refreshDay(); };

    function refreshDay() {
      const d = currentDate(), str = toDateStr(d);
      document.getElementById('datePill').textContent =
        offset === 0 ? 'Heute' : offset === -1 ? 'Gestern' :
        d.toLocaleDateString('de-CH', { weekday:'short', day:'numeric', month:'short' });
      document.getElementById('dayLabel').textContent =
        offset === 0 ? 'Heutige Einträge' : `Einträge vom ${d.toLocaleDateString('de-CH',{day:'numeric',month:'long'})}`;

      if (unsubDay) unsubDay();
      document.getElementById('listWrap').innerHTML = '<div class="spinner">Lade…</div>';

      unsubDay = onSnapshot(
        query(entriesCol, where('date','==',str)),
        snap => {
          dayEntries = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => {
              const aTime = a.createdAt?.toMillis?.() ?? Number(a.createdAt?.seconds || 0) * 1000;
              const bTime = b.createdAt?.toMillis?.() ?? Number(b.createdAt?.seconds || 0) * 1000;
              return aTime - bTime;
            });
          renderDay(); renderKcalBar();
        },
        error => {
          reportClientError('food-day-load', error);
          dayEntries = [];
          renderDayState('Einträge konnten gerade nicht geladen werden.');
          renderKcalBar();
        }
      );
    }

    function renderKcalBar() {
      const card = document.getElementById('kcalCard');
      const total = Math.round(dayEntries.reduce((s,e) => s + (e.kcal||0), 0));
      const target = kcalTarget();
      card.style.display = '';
      document.getElementById('kcalToday').textContent = `${total} kcal`;
      if (target) {
        const pct = Math.min(100, total / target * 100);
        document.getElementById('kcalGoal').textContent = `Richtwert: ~${target} kcal`;
        const fill = document.getElementById('kcalFill');
        fill.style.width = pct + '%';
        fill.classList.toggle('over', total > target);
      } else {
        document.getElementById('kcalGoal').innerHTML = readOnly
          ? 'Kein Richtwert hinterlegt'
          : `<button type="button" id="openFoodSettings" style="border:0;background:none;padding:0;color:var(--food);cursor:pointer">In Einstellungen einrichten →</button>`;
        document.getElementById('openFoodSettings')?.addEventListener('click', () => {
          window.tvzaOpenSettings?.('food');
        });
        document.getElementById('kcalFill').style.width = '0%';
      }
    }

    function renderDay() {
      const wrap = document.getElementById('listWrap');
      if (!dayEntries.length) {
        renderDayState(offset === 0
          ? 'Heute wurden noch keine Einträge erfasst.'
          : 'Für diesen Tag wurden keine Einträge erfasst.');
        return;
      }
      const order = ['🌅 Frühstück','☀️ Mittagessen','🌙 Abendessen','🍎 Snack'];
      const grouped = {};
      dayEntries.forEach(e => { (grouped[e.meal] ||= []).push(e); });

      wrap.innerHTML = order.filter(m => grouped[m]).map(meal => `
        <h3 style="font-size:13px;font-weight:700;color:var(--ink-soft);margin:14px 0 8px">${meal}</h3>
        <div class="item-list">` +
        grouped[meal].map(e => `
          <div class="item-card" data-card="${e.id}">
            <div class="item-content">
              <div class="item-title">${e.ingredients.map(i => escHtml(i.name)).join(', ')}</div>
              <div class="item-sub">≈ ${Math.round(e.kcal)} kcal · P ${e.protein?.toFixed(0)}g · KH ${e.carbs?.toFixed(0)}g · F ${e.fat?.toFixed(0)}g</div>
            </div>
            ${readOnly ? '' : `<div class="item-actions">
              <button class="btn btn-secondary" data-edit="${e.id}" title="Bearbeiten" style="padding:7px 9px"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
              <button class="btn btn-danger" data-del="${e.id}" title="Löschen">${ICON_CLOSE}</button>
            </div>`}
          </div>`).join('') + `</div>`).join('');

      if (!readOnly) {
        const editFromId = id => { const e = dayEntries.find(x => x.id === id); if (e) startEdit(e); };
        wrap.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); editFromId(b.dataset.edit); }));
        wrap.querySelectorAll('.item-card .item-content').forEach(c => c.addEventListener('click', () => editFromId(c.closest('[data-card]').dataset.card)));
      }
      wrap.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', ev => {
        ev.stopPropagation();
        frage({ titel: tOrDe('fd.eintragWeg', 'Eintrag löschen?'), ja: tOrDe('common.loeschen', 'Löschen'), gefahr: true })
          .then(ja => { if (ja) deleteDoc(doc(entriesCol, b.dataset.del)); });
      }));
    }

    function renderDayState(message) {
      document.getElementById('listWrap').innerHTML =
        `<div class="empty-state"><div class="empty-icon">${ICON_FOOD}</div><p class="empty-text">${escHtml(message)}</p></div>`;
    }

    window.addEventListener('message', event => {
      if (location.origin !== 'null' && event.origin !== location.origin) return;
      if (event.data?.type !== 'tvza-settings-food' || !event.data.profile) return;
      profile = event.data.profile;
      renderKcalBar();
    });

    /* ════ Toast ════════════════════════════════ */
    let toastTimer = null;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    /* ════ Mahlzeit automatisch nach Uhrzeit ═════
       Vorauswahl je nach Tageszeit — frei änderbar. */
    const MEALS = { breakfast:'🌅 Frühstück', lunch:'☀️ Mittagessen', dinner:'🌙 Abendessen', snack:'🍎 Snack' };
    function guessMeal() {
      const h = new Date().getHours();
      let v = MEALS.snack;
      if (h >= 5 && h < 11)       v = MEALS.breakfast;
      else if (h >= 11 && h < 15) v = MEALS.lunch;
      else if (h >= 17 && h < 22) v = MEALS.dinner;
      const sel = document.getElementById('fMeal');
      if (sel && !editing) sel.value = v;
    }

    /* ════ Speichern / Bearbeiten ════════════════ */
    let editing = null;   // {id, date} wenn ein bestehender Eintrag bearbeitet wird

    function resetForm() {
      editing = null;
      erfassung.leeren();
      document.getElementById('formTitle').textContent = 'Mahlzeit erfassen';
      document.getElementById('saveBtn').textContent = '✓ Speichern';
      document.getElementById('cancelEditBtn').style.display = 'none';
      guessMeal();
    }

    async function saveCurrentMeal() {
      const ings = erfassung.zutaten();
      if (!ings.length) { await meldung({ titel: tOrDe('fd.keineZutat', 'Bitte mindestens eine Zutat mit Gewicht eingeben.') }); return false; }
      const t = erfassung.summe();
      const payload = {
        date: editing ? editing.date : toDateStr(currentDate()),
        meal: document.getElementById('fMeal').value,
        ingredients: ings.map(i => ({ name: i.name, grams: i.g })),
        kcal: t.kcal, protein: t.protein, carbs: t.carbs, fat: t.fat, fibre: t.fibre,
        micros: [...t.micros],
      };
      try {
        if (editing) { await updateDoc(doc(entriesCol, editing.id), payload); toast('Aktualisiert ✓'); }
        else { payload.createdAt = Timestamp.now(); await addDoc(entriesCol, payload); toast('Gespeichert ✓'); }
      } catch (e) { await meldung({ titel: tOrDe('fd.speichernWeg', 'Speichern fehlgeschlagen — bitte nochmal versuchen.') }); return false; }
      resetForm();
      return true;
    }

    function startEdit(entry) {
      editing = { id: entry.id, date: entry.date };
      erfassung.setzen((entry.ingredients || []).map(i => ({ name: i.name, g: i.grams })));
      document.getElementById('fMeal').value = entry.meal || MEALS.snack;
      document.getElementById('formTitle').textContent = 'Mahlzeit bearbeiten';
      document.getElementById('saveBtn').textContent = '✓ Änderungen speichern';
      document.getElementById('cancelEditBtn').style.display = '';
      document.getElementById('entryCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('saveBtn').addEventListener('click', () => saveCurrentMeal());
    document.getElementById('cancelEditBtn').addEventListener('click', () => resetForm());

    /* ════ Freigegebene Lebensmittel (customFoods) ═══
       Vom Admin freigegebene Vorschläge — für alle sichtbar. */
    async function loadCustomFoods() {
      try {
        const qs = await getDocs(collection(db, 'customFoods'));
        registerFoods(qs.docs.map(d => d.data()));
      } catch (e) { reportClientError('custom-foods-load', e); }
    }
    loadCustomFoods();


    /* ════ Lebensmittel vorschlagen ══════════════ */
    const reqModal = document.getElementById('reqModal');
    let reqExtra = {};
    function openRequest(name = '', extra = {}) {
      reqExtra = extra;
      document.getElementById('reqName').value = name;
      document.getElementById('reqNote').value = extra.brand ? `Marke: ${extra.brand}` : '';
      reqModal.classList.add('visible');
      setTimeout(() => document.getElementById('reqName').focus(), 50);
    }
    window.openRequest = openRequest;
    document.getElementById('reqCancel').addEventListener('click', () => reqModal.classList.remove('visible'));
    reqModal.addEventListener('click', e => { if (e.target === reqModal) reqModal.classList.remove('visible'); });
    document.getElementById('reqSend').addEventListener('click', async () => {
      const name = document.getElementById('reqName').value.trim();
      if (!name) { document.getElementById('reqName').focus(); return; }
      const btn = document.getElementById('reqSend');
      btn.disabled = true; btn.textContent = 'Wird gesendet…';
      try {
        await addDoc(collection(db, 'foodRequests'), {
          name,
          note: document.getElementById('reqNote').value.trim(),
          barcode: reqExtra.barcode || '',
          brand: reqExtra.brand || '',
          requestedByUid: user.uid,
          requestedByEmail: (user.email || '').toLowerCase(),
          status: 'pending',
          createdAt: serverTimestamp(),
        });
        reqModal.classList.remove('visible');
        await meldung({ titel: tOrDe('fd.danke', 'Danke!'), text: tOrDe('fd.vorschlagOk', 'Dein Vorschlag ist unterwegs. Sobald er freigegeben ist, steht er allen zur Verfügung.') });
      } catch (e) { await meldung({ titel: tOrDe('fd.vorschlagWeg', 'Der Vorschlag liess sich nicht senden.') }); }
      btn.disabled = false; btn.textContent = 'Vorschlag senden';
    });

    /* ════ Month view ═══════════════════════════ */
    let monthDate = new Date();
    let unsubMonth = null;

    window.changeMonth = delta => {
      monthDate.setMonth(monthDate.getMonth() + delta);
      refreshMonth();
    };

    function refreshMonth() {
      const y = monthDate.getFullYear(), m = monthDate.getMonth();
      document.getElementById('monthPill').textContent =
        monthDate.toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });

      const fromStr = `${y}-${String(m+1).padStart(2,'0')}-01`;
      const lastDay = new Date(y, m+1, 0).getDate();
      const toStr   = `${y}-${String(m+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

      if (unsubMonth) unsubMonth();
      unsubMonth = onSnapshot(
        query(entriesCol, where('date','>=',fromStr), where('date','<=',toStr)),
        snap => {
          const byDay = {};
          snap.docs.forEach(d => {
            const e = d.data();
            byDay[e.date] = (byDay[e.date] || 0) + (e.kcal || 0);
          });
          renderCalendar(y, m, byDay);
        });
    }

    function renderCalendar(y, m, byDay) {
      const grid = document.getElementById('calGrid');
      const firstWeekday = (new Date(y, m, 1).getDay() + 6) % 7; // Mon=0
      const lastDay = new Date(y, m+1, 0).getDate();
      const todayStr = toDateStr(new Date());

      let html = ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div class="cal-head">${d}</div>`).join('');
      for (let i = 0; i < firstWeekday; i++) html += '<div class="cal-day empty"></div>';
      for (let d = 1; d <= lastDay; d++) {
        const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const kcal = byDay[ds];
        html += `
          <div class="cal-day ${ds === todayStr ? 'today' : ''}" data-day="${ds}">
            <span class="cal-num">${d}</span>
            ${kcal ? `<span class="cal-kcal">${Math.round(kcal)}</span>` : ''}
          </div>`;
      }
      grid.innerHTML = html;

      grid.querySelectorAll('.cal-day[data-day]').forEach(el => el.addEventListener('click', () => {
        const target = new Date(el.dataset.day + 'T12:00:00');
        const today = new Date(); today.setHours(12,0,0,0);
        offset = Math.round((target - today) / 86400000);
        showView('day');
        refreshDay();
      }));
    }

    /* ════ View switching ═══════════════════════ */
    window.showView = v => {
      document.getElementById('viewDay').style.display   = v === 'day'   ? '' : 'none';
      document.getElementById('viewMonth').style.display = v === 'month' ? '' : 'none';
      document.getElementById('tabDay').className   = 'tab' + (v==='day'   ? ' active' : '');
      document.getElementById('tabMonth').className = 'tab' + (v==='month' ? ' active' : '');
      if (v === 'month') refreshMonth();
    };

    refreshDay();
    guessMeal();   // Mahlzeit nach Tageszeit vorauswählen
  </script>
