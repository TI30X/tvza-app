<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0B1B2A" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/firn.svg" />
  <link rel="apple-touch-icon" href="../assets/icons/firn-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/kit.css?v=27" />
  <link rel="stylesheet" href="../assets/css/legacy.css?v=1" />
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=26" defer></script>
  <title data-i18n="eh.seitentitel">Einheit — Firn</title>
  <!-- Kein style-Block, kein Inline-Modul, kein style-Attribut, keine
       Hex-Farbe ausser theme-color: die Seiten-Invariante aus CLAUDE.md. -->
</head>
<body class="app">

  <div class="offline-banner" id="offlineBanner" hidden data-i18n="br.offline">Offline — Änderungen werden später gespeichert.</div>

  <!-- Den Kopf baut mountShell (shell.js); Titel und zweite Zeile setzt der
       Code über setShellTitle/setShellMeta. Bis v.35.45.0 stand hier ein
       eigener Kopf, den mountShell wegwarf — der Code schrieb dann ins Leere. -->

  <main class="main" id="main">

    <!-- Die Leitung sieht den Plan eines Athleten an: der Code sagt, wessen
         er ist. Kein data-i18n — den Namen kennt nur der Code. -->
    <p class="empty-hint" id="ansichtHinweis" hidden></p>

    <!-- Erst wählen, welche Einheit. Ein Wochenplan hat mehrere, und
         der Player zeigt immer genau eine. -->
    <section class="section" id="secWahl" hidden>
      <!-- Die Beschriftung setzt der Code: "Zur Gruppe" oder "Zum
           Training", je nachdem, woher man kam. Darum hier kein
           data-i18n — der Katalog kaeme spaeter und schriebe das
           falsche Ziel darueber. -->
      <button class="backlink" id="btnZurueckGruppe" type="button"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span id="zurueckText">Zur Gruppe</span></button>
      <div class="marke" data-i18n="eh.waehlen">Einheit wählen</div>
      <div class="rows" id="listEinheiten"></div>
    </section>

    <!-- Der Player. Eine Übung, gross, mit den Sätzen darunter — im
         Kraftraum hält man das Telefon in einer Hand. -->
    <section class="section" id="secPlayer" hidden>
      <button class="backlink" id="btnZurWahl" type="button"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Einheit wechseln</button>

      <!-- Der Fortschritt als Leiste, nicht als graue Zeile. Er ist
           das, was einen bei der Stange haelt. -->
      <div class="fortschritt" id="uebLeiste" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <span class="fortschritt__fuellung" id="uebFuellung"></span>
      </div>

      <div class="form-card">
        <p class="empty-hint" id="uebPos"></p>

        <!-- Name und Video in einer Zeile: das Video gehoert an den
             Namen, nicht in eine eigene Zeile darunter. Wer die Uebung
             kennt, sieht es nicht; wer sie nicht kennt, findet es dort,
             wo er ohnehin hinschaut. -->
        <div class="ueb-kopf">
          <div class="form-title" id="uebName">—</div>
          <a class="ueb-video" id="uebVideo" target="_blank" rel="noopener" hidden
             data-i18n-attr="title:eh.videoAnsehen;aria-label:eh.videoAnsehen" title="Video ansehen">
            <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <span data-i18n="eh.video">Video</span>
          </a>
        </div>
        <p class="empty-hint" id="uebMeta" hidden></p>

        <!-- Der Timer: die Pause nach einem Satz ("120-180 Sec") läuft
             von selbst an, eine Übung auf Zeit ("30 Sec pro Seite",
             2 Sätze) startet man je Runde. Beschriftet vom Code. -->
        <div class="uhr" id="uhr" hidden>
          <div class="uhr__kopf">
            <span class="uhr__was" id="uhrWas"></span>
            <span class="uhr__runde" id="uhrRunde"></span>
          </div>
          <div class="uhr__zeit" id="uhrZeit" role="timer" aria-live="off">0:00</div>
          <div class="uhr__leiste"><span class="uhr__fuellung" id="uhrFuellung"></span></div>
          <div class="uhr__knoepfe">
            <button class="b b--primary" id="uhrStart" type="button">Start</button>
            <button class="b b--secondary" id="uhrPlus" type="button" hidden>+15 s</button>
            <button class="b b--secondary" id="uhrStopp" type="button">Zurücksetzen</button>
          </div>
        </div>

        <!-- Bilder zur Uebung, wo die Vorlage welche hat: wie steht der
             Fuss, wo liegt der Ball. Die alte Trainingsseite zeigte sie;
             beim Umzug auf die Gruppe durften sie nicht verloren gehen. -->
        <div class="ueb-bilder" id="uebBilder" hidden></div>

        <div class="rows" id="listSaetze"></div>

        <!-- Die andere Trainingswoche. Genau daraus liest man ab, ob
             es besser geworden ist. -->
        <div id="uebVorwochen" hidden></div>

        <div class="form-group">
          <label class="form-label" for="uebNotiz">Notiz</label>
          <input class="form-input" id="uebNotiz" type="text" maxlength="200" placeholder="z.B. zog im Knie" />
        </div>

        <button class="b b--primary b--block" id="btnErledigt" type="button" data-i18n="eh.erledigt">Übung erledigt</button>
      </div>

      <div class="seg" id="blaettern" role="group" aria-label="Übung wechseln">
        <button class="seg__item" type="button" id="btnVor">Zurück</button>
        <button class="seg__item" type="button" id="btnWeiter" data-i18n="eh.weiter">Weiter</button>
      </div>
    </section>

    <!-- Am Ende. Kein Konfetti, aber auch nicht einfach die Liste von
         vorn — man soll merken, dass es vorbei ist. -->
    <section class="section" id="secFertig" hidden>
      <div class="hint">
        <div class="hint__text" id="fertigText">Einheit erledigt.</div>
      </div>
      <div class="rows">
        <button class="b b--secondary b--block" id="btnNochmal" type="button">Einheit nochmal ansehen</button>
        <button class="b b--secondary b--block" id="btnFertigZurueck" type="button">Zur Gruppe</button>
      </div>
    </section>

    <p class="empty-hint" id="ladeFehler" hidden></p>

  </main>

  <script type="module" src="../assets/js/feature/einheit/einheit.js?v=20"></script>
</body>
</html>
