<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231971C2'/><text x='16' y='22' font-family='Georgia,serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'>TvZ</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/kit.css?v=3" />
  <link rel="stylesheet" href="../assets/css/legacy.css?v=1" />
  <link rel="stylesheet" href="../assets/css/feature/ski.css?v=2" />
  <title>Ski Tracker — TVZA</title>
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=26" defer></script>
</head>
<body class="app">

  <div class="offline-banner" id="offlineBanner"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 11l-2 3H4l1 3 3 1 1-3 3-2 3.1 5.1a1 1 0 0 0 1.7-.9z"/></svg> Offline – wird später synchronisiert</div>

  <header class="appbar appbar--bereich" data-bereich="ski">
    <div class="appbar__inner">
      <a href="../index.html" class="appbar__btn back-btn" aria-label="Zurück" data-i18n-attr="aria-label:a11y.zurueck"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <span class="appbar__title" data-i18n="mod.ski.name">Ski Tracker</span>
      <span class="appbar__end">
      <button class="appbar__btn" id="themeToggle" title="Theme wechseln" data-i18n-attr="title:pg.theme"></button>
      </span>
    </div>
    <div class="appbar__accent"></div>
  </header>

  <main class="main">

    <div class="tabs">
      <div class="tab active" id="tabSkis" onclick="showTab('skis')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 8 5-5 5 15H2L8 3z"/></svg> <span>Meine Skis</span></div>
      <div class="tab" id="tabLog" onclick="showTab('log')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> <span data-i18n="ski.wartung">Wartung</span></div>
    </div>

    <!-- ═══ Skis ═══ -->
    <div id="panelSkis">
      <div class="form-card">
        <p class="form-title" id="skiFormTitle" data-i18n="ski.hinzufuegen">Ski hinzufügen</p>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="skiName" data-i18n="ski.nameModell">Name / Modell</label>
            <input class="form-input" id="skiName" type="text" placeholder="z.B. Atomic Redster SL" data-i18n-attr="placeholder:ski.beispielName" />
          </div>
          <div class="form-group">
            <label class="form-label" for="skiNum" data-i18n="ski.nummer">Nummer</label>
            <input class="form-input" id="skiNum" type="number" min="1" placeholder="1" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="ski.disziplin">Disziplin</label>
          <div class="seg" id="segDisziplin">
            <span class="seg-opt" data-val="SL">SL</span>
            <span class="seg-opt" data-val="GS">GS</span>
            <span class="seg-opt" data-val="SG">SG</span>
            <span class="seg-opt" data-val="Abfahrt" data-i18n="ski.abfahrt">Abfahrt</span>
          </div>
        </div>
        <div class="form-actions">
          <button class="b b--primary" id="saveSkiBtn"><span class="ui-plus" aria-hidden="true"></span><span data-i18n="common.speichern">Speichern</span></button>
          <button class="b b--secondary" id="cancelEditBtn" hidden data-i18n="common.abbrechen">Abbrechen</button>
        </div>
      </div>

      <h2 class="section-title" data-i18n="ski.skis">Skis</h2>
      <div id="skiList"><div class="spinner" data-fx-rows="4" data-i18n="common.laden">Lade…</div></div>
    </div>

    <!-- ═══ Maintenance log ═══ -->
    <div id="panelLog" hidden>
      <div class="form-card">
        <p class="form-title" data-i18n="ski.eintrag">Wartungseintrag</p>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="logSki" data-i18n="ski.ski">Ski</label>
            <select class="form-select" id="logSki"><option value="" data-i18n="ski.waehlen">— wählen —</option></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="logDate" data-i18n="ski.datum">Datum</label>
            <input class="form-input" id="logDate" type="date" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="ski.schliff">Schliff</label>
          <div class="seg" id="segSchliff">
            <span class="seg-opt" data-val="Feile" data-i18n="ski.feile">Feile</span>
            <span class="seg-opt" data-val="Diamant" data-i18n="ski.diamant">Diamant</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="ski.schaerfe">Schärfe (1 = stumpf · 5 = sehr scharf)</label>
          <div class="stars" id="starsSchaerfe">
            <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="ski.wachs">Wachs</label>
          <div class="seg" id="segWaxTyp">
            <span class="seg-opt" data-val="Schnellwachs" data-i18n="ski.schnellwachs">Schnellwachs</span>
            <span class="seg-opt" data-val="Heisswachs" data-i18n="ski.heisswachs">Heisswachs</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="ski.wachsFarbe">Wachs-Farbe</label>
          <div class="seg" id="segWaxFarbe">
            <span class="seg-opt" data-val="Blau" data-i18n="ski.blau">Blau</span>
            <span class="seg-opt" data-val="Gelb" data-i18n="ski.gelb">Gelb</span>
            <span class="seg-opt" data-val="Rot" data-i18n="ski.rot">Rot</span>
            <span class="seg-opt" data-val="Grün" data-i18n="ski.gruen">Grün</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="logNotes" data-i18n="ski.notizen">Notizen (optional)</label>
          <input class="form-input" id="logNotes" type="text" placeholder="z.B. für Rennen vorbereitet" data-i18n-attr="placeholder:ski.beispielNotiz" />
        </div>

        <button class="b b--primary b--block" id="addLogBtn"><span class="ui-plus" aria-hidden="true"></span><span data-i18n="ski.speichern">Eintrag speichern</span></button>
      </div>

      <h2 class="section-title" data-i18n="ski.protokoll">Protokoll</h2>
      <div id="logList"><div class="spinner" data-fx-rows="3" data-i18n="common.laden">Lade…</div></div>
    </div>

  </main>

  <script type="module" src="../assets/js/feature/ski/ski.js?v=1"></script>
  <script type="module" src="../assets/js/nav.js?v=7"></script>
</body>
</html>
