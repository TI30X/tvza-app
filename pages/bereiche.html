<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="icon" href="../assets/icons/icon-192.png" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/kit.css?v=1" />
  <link rel="stylesheet" href="../assets/css/legacy.css?v=1" />
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=26" defer></script>
  <title>Bereiche — TVZA</title>
  <!-- No <style> block. Everything on this page comes from the kit in
       assets/css/style.css — that is the point of the redesign. -->
</head>
<body class="app">

  <div class="offline-banner" id="offlineBanner" hidden data-i18n="br.offline">Offline — Änderungen werden später gespeichert.</div>

  <!-- Diese Seite war die einzige Tab-Seite ganz ohne Kopfzeile (§6.2). -->
  <header class="appbar">
    <div class="appbar__inner">
      <div class="appbar__spacer">
        <div class="appbar__greet" data-i18n="br.alle">Alle Bereiche</div>
      </div>
    </div>
  </header>

  <main class="main" id="main">
    <section class="section" id="secMine">
      <div class="marke">Meine Bereiche</div>
      <div class="rows" id="listMine"><div class="spinner" data-fx-rows="4" data-i18n="common.laden">Lade…</div></div>
    </section>

    <section class="section" id="secShared" hidden>
      <div class="marke" data-i18n="home.mitMirGeteilt">Mit mir geteilt</div>
      <div class="rows" id="listShared"></div>
    </section>

    <section class="section">
      <button class="b b--secondary b--block" id="manageBtn" data-i18n="br.verwalten">Bereiche verwalten</button>
    </section>
  </main>

  <script type="module" src="../assets/js/feature/bereiche/bereiche.js?v=1"></script>
</body>
</html>
