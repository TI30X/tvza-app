  <title>Planner — TVZA</title>
  <style>
    /* ── Language selector ── */
    .lang-sel {
      font-size: 13px; font-family: inherit; cursor: pointer;
      padding: 4px 6px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--ink); min-height: 36px;
    }
    .lang-sel:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Calendar / share action buttons ── */
    .action-row {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
    }
    .pill-btn {
      font-size: 11px; font-weight: 600; padding: 5px 10px;
      border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--ink);
      cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 4px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .pill-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
    .pill-btn:active { opacity: 0.75; }

    /* ── Invite / share link row ── */
    .invite-strip {
      display: flex; gap: 8px; align-items: center; margin-top: 12px;
      padding: 8px 10px; border-radius: 8px;
      background: var(--surface-2); border: 1px solid var(--border);
    }
    .invite-strip span {
      flex: 1; font-size: 11px; color: var(--ink-soft);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .invite-strip button {
      font-size: 11px; font-weight: 600; padding: 5px 10px;
      border-radius: 6px; border: 1px solid var(--accent);
      background: var(--accent-bg); color: var(--accent); cursor: pointer; white-space: nowrap;
    }

    /* ── Pending cards ── */
    .pending-card {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    .pending-card:last-child { border-bottom: none; }

    /* ── Plan viewer modal (full-screen iframe overlay) ── */
    #planModal {
      display: none; position: fixed; inset: 0; z-index: 9999;
      flex-direction: column; background: var(--bg);
    }
    #planModal.visible { display: flex; }
    .plan-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      background: var(--surface-1); flex-shrink: 0;
    }
    .plan-bar-title { font-weight: 700; font-size: 15px; flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    #planFrame { flex: 1; border: none; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="app">

    <div class="offline-banner" id="offlineBanner"></div>

    <header class="header">

    <main class="main">

      <div id="noGroupView" style="display:none">

          </div>

        </div>

        <div class="form-card">
          <p class="form-title" id="lblJoinGroup"></p>
          <div class="form-group">
            <input class="form-input" id="joinGrpName" type="text" />
          </div>

        </div>
      </div>

      <!-- ═══ Group + trips ═══ -->
      <div id="groupView" style="display:none">

        <!-- Group info card -->

            </div>
          </div>

          <!-- Invite link strip (shown to all members) -->
          <div class="invite-strip" id="inviteStrip" style="display:none">
            <span id="inviteUrlDisplay"></span>
            <button id="copyInviteBtn"></button>
          </div>
        </div>

        <!-- New trip form -->
        <div class="form-card">
          <p class="form-title" id="lblNewTrip"></p>
          <div class="form-group">
            <input class="form-input" id="tripName" type="text" />
          </div>
          <div class="form-group">
            <input class="form-input" id="tripDest" type="text" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" id="lblFrom"></label>
              <input class="form-input" id="tripStart" type="date" />
            </div>
            <div class="form-group">
              <label class="form-label" id="lblTo"></label>
              <input class="form-input" id="tripEnd" type="date" />
            </div>
          </div>
          <div class="form-group">
            <textarea class="form-textarea" id="tripNotes" rows="2"></textarea>
          </div>
          <button class="btn btn-primary btn-block" id="addTripBtn"></button>
        </div>

        <h2 class="section-title" id="lblGroupTrips"></h2>
        <div id="tripList"><div class="spinner" id="tripSpinner"></div></div>

      </div>

      <!-- ═══ Trip detail ═══ -->
      <div id="detailView" style="display:none">
        <div id="tripInfoCard" class="form-card" style="border-left:4px solid var(--trip)"></div>

        <!-- Custom plan section -->
        <div class="form-card" id="planSection">
          <p class="form-title" id="lblPlanSection"></p>
          <div id="planLinkDisplay"></div>
          <div id="planLinkEdit" style="display:none">
            <div class="form-group" style="margin-top:8px">
              <input class="form-input" id="planUrlInput" type="url" />
            </div>
            <div style="display:flex;gap:8px;margin-top:8px">
              <button class="btn btn-primary" id="savePlanBtn"></button>
              <button class="btn btn-secondary" id="cancelPlanBtn"></button>
            </div>
          </div>
        </div>

        <div class="form-card">
          <p class="form-title" id="lblActivity"></p>
          <div class="form-row">
            <div class="form-group">
              <input class="form-input" id="actName" type="text" />
            </div>
            <div class="form-group">
              <input class="form-input" id="actDate" type="date" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" id="lblAssigned"></label>
            <select class="form-select" id="actWho"></select>
          </div>
          <button class="btn btn-primary btn-block" id="addActBtn"></button>
        </div>

        <h2 class="section-title" id="lblActivities"></h2>
        <div id="actList"><div class="spinner" id="actSpinner"></div></div>

        <button class="btn btn-danger" id="deleteTripBtn"
                style="width:100%;padding:12px;margin-top:20px"></button>
      </div>

    </main>

    /* Declare these early so applyI18n() can safely reference them */
    let group = null;
    let currentTripData = null;
    let memberNames = {};
    let currentTripId = null;
    let cachedTrips = [];

    const langSel = document.getElementById('langSel');
    langSel.value = langKey;
    langSel.addEventListener('change', () => {
      langKey = langSel.value;
      localStorage.setItem('tvza.plannerLang', langKey);

    });
    applyI18n();

    /* ════════════════════════════════════════════════════════════
       Icons
    ════════════════════════════════════════════════════════════ */
    const ICON_CLOSE = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6L6 18M6 6l12 12"/></svg>`;
    const ICON_MAP = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
      stroke-linecap="round" stroke-linejoin="round">
      <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
      <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>`;

    /* ════════════════════════════════════════════════════════════
       Calendar helpers
    ════════════════════════════════════════════════════════════ */
    function toCalDate(s) { return (s || '').replace(/-/g, ''); }

    function gcalUrl(trip) {
      const start = toCalDate(trip.startDate);
      const end = toCalDate(trip.endDate) || start;
      const url = new URL('https://calendar.google.com/calendar/r/eventedit');
      url.searchParams.set('text', trip.name);
      if (start) url.searchParams.set('dates', `${start}/${end}`);
      if (trip.destination) url.searchParams.set('location', trip.destination);
      if (trip.notes) url.searchParams.set('details', trip.notes);
      return url.toString();
    }

    function downloadIcs(trip) {
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const dtStart = toCalDate(trip.startDate) || today;
      const dtEnd = toCalDate(trip.endDate) || dtStart;
      const esc = s => (s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TVZA Planner//EN',
        'BEGIN:VEVENT',
        `UID:${trip.id}@tvza-planner`,
        `DTSTART;VALUE=DATE:${dtStart}`,
        `DTEND;VALUE=DATE:${dtEnd}`,
        `SUMMARY:${esc(trip.name)}`,
        trip.destination ? `LOCATION:${esc(trip.destination)}` : null,
        trip.notes ? `DESCRIPTION:${esc(trip.notes)}` : null,
        'END:VEVENT', 'END:VCALENDAR'
      ].filter(Boolean).join('\r\n');
      const blob = new Blob([lines], { type: 'text/calendar;charset=utf-8' });
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(blob),
        download: `${trip.name.replace(/[^a-z0-9_-]/gi, '_')}.ics`
      });
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    /* ════════════════════════════════════════════════════════════
       Clipboard helper
    ════════════════════════════════════════════════════════════ */
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return; } catch {}
      const inp = Object.assign(document.createElement('input'), { value: text });
      document.body.appendChild(inp); inp.select();
      document.execCommand('copy'); inp.remove();
    }

    function flashBtn(btn, msg) {
      const orig = btn.textContent;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = orig; }, 2000);
    }

    /* ════════════════════════════════════════════════════════════
       Invite-token helper
    ════════════════════════════════════════════════════════════ */
    function randomToken(len = 22) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
      return Array.from(crypto.getRandomValues(new Uint8Array(len)))
        .map(b => chars[b % chars.length]).join('');
    }

    function buildInviteUrl(grpId, token) {
      return `${location.origin}${location.pathname}?invite=${grpId}&token=${token}`;
    }

    function buildTripUrl(tripId) {
      return `${location.origin}${location.pathname}?trip=${tripId}`;
    }

    /* ════════════════════════════════════════════════════════════
       Firebase boot
    ════════════════════════════════════════════════════════════ */
    wireOfflineBanner();
    const user = await requireAuth('../login.html');

    const grpCol = collection(db, 'families');   // collection name unchanged for back-compat
    const userRef = doc(db, 'users', user.uid);
    let myProfile = {};
    { const s = await getDoc(userRef); myProfile = s.exists() ? s.data() : {}; }

    // (group, memberNames, currentTripId, currentTripData, cachedTrips declared above applyI18n)
    let unsubGrp = null, unsubTrips = null, unsubActs = null;

    /* URL params */
    const urlParams = new URLSearchParams(location.search);
    const inviteGrpId   = urlParams.get('invite');
    const inviteToken   = urlParams.get('token');
    const directTripId  = urlParams.get('trip');

    /* ════════════════════════════════════════════════════════════
       Init — determine group membership
    ════════════════════════════════════════════════════════════ */
    async function init() {
      // 1. Handle invite link first
      if (inviteGrpId && inviteToken) {
        const handled = await handleInviteLink();
        if (handled) return;
      }

      // 2. Existing membership
      if (myProfile.familyId) {
        const fs = await getDoc(doc(grpCol, myProfile.familyId));
        if (fs.exists() && (fs.data().members || []).includes(user.uid)) {
          watchGroup(myProfile.familyId);
          return;
        }
        await updateDoc(userRef, { familyId: null });
        myProfile.familyId = null;
      }

      showNoGroup();
    }

    /* ════════════════════════════════════════════════════════════
       Invite-link handler — auto-join on valid token
    ════════════════════════════════════════════════════════════ */
    async function handleInviteLink() {
      try {
        const snap = await getDoc(doc(grpCol, inviteGrpId));
        if (!snap.exists()) return false;
        const data = snap.data();

        // Already a member → just open the group
        if ((data.members || []).includes(user.uid)) {
          history.replaceState({}, '', location.pathname);
          await updateDoc(userRef, { familyId: inviteGrpId });
          watchGroup(inviteGrpId);
          return true;
        }

        // Token matches → auto-join (no approval needed)
        if (data.inviteToken && data.inviteToken === inviteToken) {
          await updateDoc(doc(grpCol, inviteGrpId), { members: arrayUnion(user.uid) });
          await updateDoc(userRef, { familyId: inviteGrpId, role: 'member' });
          history.replaceState({}, '', location.pathname);
          watchGroup(inviteGrpId);
          const status = document.getElementById('joinStatus');
          status.textContent = t('autoJoined').replace('{name}', data.name || '');
          return true;
        }
      } catch (e) { console.warn('Invite link error:', e); }
      return false;
    }

    /* ════════════════════════════════════════════════════════════
       No-group view
    ════════════════════════════════════════════════════════════ */
    function showNoGroup() {
      document.getElementById('noGroupView').style.display = '';
      document.getElementById('groupView').style.display = 'none';
      checkPending();
    }

    async function checkPending() {
      const qs = await getDocs(query(grpCol, where('pendingRequests', 'array-contains', user.uid)));
      if (!qs.empty) {
        const f = qs.docs[0].data();
        document.getElementById('joinStatus').textContent =
          t('requestPending').replace('{name}', f.name || '');
      }
    }

    /* ════════════════════════════════════════════════════════════
       Create group
    ════════════════════════════════════════════════════════════ */
    document.getElementById('createGrpBtn').addEventListener('click', async () => {
      const name = document.getElementById('newGrpName').value.trim();
      if (!name) { alert(t('pleaseGrpName')); return; }
      const existing = await getDocs(query(grpCol, where('name', '==', name)));
      if (!existing.empty) { alert(t('nameExists')); return; }
      const invToken = randomToken();
      const ref = await addDoc(grpCol, {
        name, headUid: user.uid, managers: [user.uid], members: [user.uid],
        pendingRequests: [], inviteToken: invToken, createdAt: serverTimestamp()
      });
      await updateDoc(userRef, { familyId: ref.id, role: 'manager' });
      myProfile.familyId = ref.id;
      document.getElementById('noGroupView').style.display = 'none';
      watchGroup(ref.id);
    });

    /* ════════════════════════════════════════════════════════════
       Join request
    ════════════════════════════════════════════════════════════ */
    document.getElementById('joinGrpBtn').addEventListener('click', async () => {
      const name = document.getElementById('joinGrpName').value.trim();
      if (!name) { alert(t('pleaseGrpName')); return; }
      const qs = await getDocs(query(grpCol, where('name', '==', name)));
      if (qs.empty) { alert(t('grpNotFound')); return; }
      const grpDoc = qs.docs[0];
      const data = grpDoc.data();
      if ((data.members || []).includes(user.uid)) { alert(t('alreadyMember')); return; }
      if ((data.pendingRequests || []).includes(user.uid)) { alert(t('requestAlreadySent')); return; }
      await updateDoc(doc(grpCol, grpDoc.id), { pendingRequests: arrayUnion(user.uid) });
      document.getElementById('joinStatus').textContent =
        t('requestPending').replace('{name}', data.name || '');
    });

    /* ════════════════════════════════════════════════════════════
       Watch group (real-time)
    ════════════════════════════════════════════════════════════ */
    function watchGroup(grpId) {
      document.getElementById('groupView').style.display = '';
      document.getElementById('noGroupView').style.display = 'none';
      if (unsubGrp) unsubGrp();

      unsubGrp = onSnapshot(doc(grpCol, grpId), async snap => {
        if (!snap.exists()) { location.reload(); return; }
        group = { id: snap.id, ...snap.data() };

        // Ensure managers field exists
        if (!(group.managers?.length) && group.headUid) {
          group.managers = [group.headUid];
          updateDoc(doc(grpCol, grpId), { managers: group.managers }).catch(console.warn);
        }

        // Kicked out?
        if (!(group.members || []).includes(user.uid)) {
          await updateDoc(userRef, { familyId: null });
          location.reload(); return;
        }

        document.getElementById('grpName').textContent = group.name;
        await loadMemberNames();
        renderMembers();
        renderAdminPanel();
        renderInviteStrip();
        refreshWhoSelect();
      });

      watchTrips(grpId);

      // If opened via direct trip link, open that trip after group loads
      if (directTripId) {
        setTimeout(() => {
          if (cachedTrips.find(t => t.id === directTripId)) {
            openTrip(directTripId);
            history.replaceState({}, '', location.pathname);
          }
        }, 1500);
      }
    }

    async function loadMemberNames() {
      const uids = [...new Set([...(group.members || []), ...(group.pendingRequests || [])])];
      for (const uid of uids) {
        if (memberNames[uid]) continue;
        try {
          const s = await getDoc(doc(db, 'users', uid));
          memberNames[uid] = s.exists() ? s.data().displayName : '?';
        } catch { memberNames[uid] = '?'; }
      }
    }

    function grpManagers() {
      return [...new Set([...(group?.managers || []), group?.headUid].filter(Boolean))];
    }
    function isManager() { return grpManagers().includes(user.uid); }

    function renderMembers() {
      const mgrs = grpManagers();
      document.getElementById('grpMembers').innerHTML =
        (group.members || []).map(uid => {
          const star = mgrs.includes(uid) ? '★ ' : '';
          return `${star}${escHtml(memberNames[uid] || '?')}`;
        }).join(' · ');
    }

    function renderAdminPanel() {
      const wrap = document.getElementById('pendingWrap');
      if (!isManager()) { wrap.innerHTML = ''; return; }
      const mgrs = grpManagers();
      const pending = group.pendingRequests || [];
      let html = '';

      if (pending.length) {
        html += `<div style="font-size:12px;font-weight:600;margin-bottom:6px">${t('joinRequests')}:</div>` +
          pending.map(uid => `
          <div class="pending-card">
            <span style="flex:1">👤 ${escHtml(memberNames[uid] || '?')}</span>
            <button class="btn btn-primary" style="padding:5px 10px" data-approve="${uid}">✓</button>
            <button class="btn btn-secondary" style="padding:5px 10px" data-reject="${uid}">${ICON_CLOSE}</button>
          </div>`).join('');
      }

      html += `<div style="font-size:12px;font-weight:600;margin:12px 0 6px">${t('admins')}</div>` +
        (group.members || []).map(uid => {
          const isMgr = mgrs.includes(uid);
          const last = isMgr && mgrs.length <= 1;
          return `
          <div class="pending-card">
            <span style="flex:1">${isMgr ? '★' : '👤'} ${escHtml(memberNames[uid] || '?')}</span>
            <button class="btn ${isMgr ? 'btn-secondary' : 'btn-primary'}" style="padding:5px 10px"
                    data-mgr="${uid}" data-ismgr="${isMgr ? '1' : ''}" ${last ? 'disabled' : ''}>
              ${isMgr ? t('removeAdmin') : t('makeAdmin')}
            </button>
          </div>`;
        }).join('');

      wrap.innerHTML = html;

      wrap.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
        const uid = b.dataset.approve;
        await updateDoc(doc(grpCol, group.id), {
          members: arrayUnion(uid), pendingRequests: arrayRemove(uid)
        });
        await updateDoc(doc(db, 'users', uid), { familyId: group.id, role: 'member' });
      }));

      wrap.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', () =>
        updateDoc(doc(grpCol, group.id), { pendingRequests: arrayRemove(b.dataset.reject) })));

      wrap.querySelectorAll('[data-mgr]').forEach(b => b.addEventListener('click', async () => {
        const uid = b.dataset.mgr;
        const wasMgr = b.dataset.ismgr === '1';
        const next = wasMgr ? grpManagers().filter(id => id !== uid) : [...grpManagers(), uid];
        if (!next.length) { alert(t('minOneAdmin')); return; }
        await updateDoc(doc(grpCol, group.id), { managers: next, headUid: next[0] });
        await updateDoc(doc(db, 'users', uid), { role: wasMgr ? 'member' : 'manager' }).catch(console.warn);
      }));
    }

    /* Invite strip — visible to all members */
    async function renderInviteStrip() {
      const strip = document.getElementById('inviteStrip');
      let token = group.inviteToken;

      // Generate token if missing (first time for old groups)
      if (!token) {
        token = randomToken();
        await updateDoc(doc(grpCol, group.id), { inviteToken: token }).catch(console.warn);
      }

      const url = buildInviteUrl(group.id, token);
      document.getElementById('inviteUrlDisplay').textContent = url;
      strip.style.display = 'flex';
    }

    document.getElementById('copyInviteBtn').addEventListener('click', async () => {
      const token = group?.inviteToken;
      if (!token) return;
      await copyText(buildInviteUrl(group.id, token));
      flashBtn(document.getElementById('copyInviteBtn'), t('linkCopied'));
    });

    /* ════════════════════════════════════════════════════════════
       Trips (list)
    ════════════════════════════════════════════════════════════ */
    function watchTrips(grpId) {
      if (unsubTrips) unsubTrips();
      unsubTrips = onSnapshot(
        query(collection(db, 'trips'), where('familyId', '==', grpId), orderBy('createdAt', 'desc')),
        snap => {
          cachedTrips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderTrips(cachedTrips);
        });
    }

    function renderTrips(trips) {
      const wrap = document.getElementById('tripList');
      if (!trips.length) {
        wrap.innerHTML = `<div class="empty-state">
          <div class="empty-icon">${ICON_MAP}</div>
          <p class="empty-text">${t('noTrips')}</p></div>`;
        return;
      }

      wrap.innerHTML = trips.map(trip => {
        const hasDates = !!trip.startDate;
        return `
        <div class="trip-card" data-trip="${trip.id}" style="cursor:pointer">
          <div class="trip-name">${escHtml(trip.name)}</div>
          <div class="trip-meta">
            📍 ${escHtml(trip.destination || '–')}
            ${hasDates ? ` · 📅 ${trip.startDate}${trip.endDate ? ' – ' + trip.endDate : ''}` : ''}
          </div>
          ${trip.notes ? `<div class="trip-meta" style="margin-top:4px">📝 ${escHtml(trip.notes)}</div>` : ''}
          <div class="action-row">
            ${trip.planUrl
              ? `<button class="pill-btn" data-view-plan="${trip.id}"
                         style="font-weight:700;border-color:var(--trip);color:var(--trip)">${t('viewPlan')}</button>`
              : ''}
            ${hasDates
              ? `<button class="pill-btn" data-gcal="${trip.id}">${t('gcal')}</button>
                 <button class="pill-btn" data-ics="${trip.id}">${t('icsDownload')}</button>`
              : ''}
            <button class="pill-btn" data-share-trip="${trip.id}">${t('shareTrip')}</button>
          </div>
        </div>`;
      }).join('');

      // Open trip on card click (not on button clicks)
      wrap.querySelectorAll('[data-trip]').forEach(card =>
        card.addEventListener('click', e => {
          if (e.target.closest('button')) return;
          openTrip(card.dataset.trip);
        }));

      // View plan button
      wrap.querySelectorAll('[data-view-plan]').forEach(btn =>
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const trip = cachedTrips.find(tr => tr.id === btn.dataset.viewPlan);
          if (trip?.planUrl) openPlanModal(trip.planUrl, trip.name);
        }));

      // Google Calendar
      wrap.querySelectorAll('[data-gcal]').forEach(btn =>
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const trip = cachedTrips.find(tr => tr.id === btn.dataset.gcal);
          if (trip) window.open(gcalUrl(trip), '_blank', 'noopener');
        }));

      // ICS download
      wrap.querySelectorAll('[data-ics]').forEach(btn =>
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const trip = cachedTrips.find(tr => tr.id === btn.dataset.ics);
          if (trip) downloadIcs(trip);
        }));

      // Share trip link
      wrap.querySelectorAll('[data-share-trip]').forEach(btn =>
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          await copyText(buildTripUrl(btn.dataset.shareTrip));
          flashBtn(btn, t('tripLinkCopied'));
        }));
    }

    document.getElementById('addTripBtn').addEventListener('click', async () => {
      const name = document.getElementById('tripName').value.trim();
      if (!name) { alert(t('tripNameRequired')); return; }
      await addDoc(collection(db, 'trips'), {
        familyId: group.id, name,
        destination: document.getElementById('tripDest').value.trim(),
        startDate: document.getElementById('tripStart').value,
        endDate: document.getElementById('tripEnd').value,
        notes: document.getElementById('tripNotes').value.trim(),
        createdBy: user.uid, createdAt: serverTimestamp()
      });
      ['tripName', 'tripDest', 'tripStart', 'tripEnd', 'tripNotes']
        .forEach(id => document.getElementById(id).value = '');
    });

    /* ════════════════════════════════════════════════════════════
       Trip detail
    ════════════════════════════════════════════════════════════ */
    function refreshWhoSelect() {
      const sel = document.getElementById('actWho');
      const cur = sel.value;
      sel.innerHTML = `<option value="">${t('nobody')}</option>` +
        (group.members || []).map(uid =>
          `<option value="${uid}">${escHtml(memberNames[uid] || '?')}</option>`).join('');
      sel.value = cur;
    }

    function renderTripInfoCard(trip) {
      const hasDates = !!trip.startDate;
      document.getElementById('tripInfoCard').innerHTML = `
        <div style="font-size:18px;font-weight:700;margin-bottom:6px">${escHtml(trip.name)}</div>
        <div style="font-size:13px;color:var(--ink-soft)">
          📍 ${escHtml(trip.destination || '–')}
          ${hasDates ? ` · 📅 ${trip.startDate}${trip.endDate ? ' – ' + trip.endDate : ''}` : ''}
        </div>
        ${trip.notes ? `<div style="font-size:13px;margin-top:8px;color:var(--ink-soft)">📝 ${escHtml(trip.notes)}</div>` : ''}
        <div class="action-row" style="margin-top:12px">
          ${hasDates
            ? `<button class="pill-btn" id="detailGcalBtn">${t('gcal')}</button>
               <button class="pill-btn" id="detailIcsBtn">${t('icsDownload')}</button>`
            : ''}
          <button class="pill-btn" id="detailShareBtn">${t('shareTrip')}</button>
        </div>`;

      if (hasDates) {
        document.getElementById('detailGcalBtn')
          .addEventListener('click', () => window.open(gcalUrl(trip), '_blank', 'noopener'));
        document.getElementById('detailIcsBtn')
          .addEventListener('click', () => downloadIcs(trip));
      }
      document.getElementById('detailShareBtn').addEventListener('click', async () => {
        await copyText(buildTripUrl(trip.id));
        flashBtn(document.getElementById('detailShareBtn'), t('tripLinkCopied'));
      });
    }

    async function openTrip(tripId) {
      currentTripId = tripId;
      document.getElementById('groupView').style.display = 'none';
      document.getElementById('detailView').style.display = '';

      const back = document.getElementById('backBtn');
      document.getElementById('backLabel').textContent = t('allTrips');
      back.removeAttribute('href');
      back.onclick = closeTrip;

      const ts = await getDoc(doc(db, 'trips', tripId));
      if (ts.exists()) {
        currentTripData = { id: ts.id, ...ts.data() };
        document.getElementById('pageTitle').textContent = currentTripData.name;
        renderTripInfoCard(currentTripData);
        renderPlanSection(currentTripData.planUrl || null);
      }

      if (unsubActs) unsubActs();
      unsubActs = onSnapshot(
        query(collection(db, 'activities'), where('tripId', '==', tripId), orderBy('createdAt', 'asc')),
        snap => renderActs(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
    }

    function closeTrip() {
      if (unsubActs) { unsubActs(); unsubActs = null; }
      currentTripId = null;
      currentTripData = null;
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('groupView').style.display = '';
      document.getElementById('pageTitle').textContent = t('title');
      document.getElementById('backLabel').textContent = t('back');
      const back = document.getElementById('backBtn');
      back.onclick = null;
      back.href = '../index.html';
    }

    function renderActs(acts) {
      const wrap = document.getElementById('actList');
      if (!acts.length) {
        wrap.innerHTML = `<div class="empty-state">
          <div class="empty-icon">✅</div>
          <p class="empty-text">${t('noActivities')}</p></div>`;
        return;
      }
      wrap.innerHTML = '<div class="item-list">' + acts.map(a => `
        <div class="item-card">
          <div class="item-check ${a.done ? 'done' : ''}" data-toggle="${a.id}"
               data-done="${a.done}">${a.done ? '✓' : ''}</div>
          <div class="item-content">
            <div class="item-title ${a.done ? 'done' : ''}">${escHtml(a.name)}</div>
            <div class="item-sub">
              ${a.date ? '📅 ' + a.date : ''}
              ${a.assignedTo ? (a.date ? ' · ' : '') + '👤 ' + escHtml(memberNames[a.assignedTo] || '?') : ''}
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-danger" data-del="${a.id}">${ICON_CLOSE}</button>
          </div>
        </div>`).join('') + '</div>';

      wrap.querySelectorAll('[data-toggle]').forEach(el =>
        el.addEventListener('click', () =>
          updateDoc(doc(db, 'activities', el.dataset.toggle), { done: el.dataset.done !== 'true' })));

      wrap.querySelectorAll('[data-del]').forEach(el =>
        el.addEventListener('click', () => {
          if (confirm(t('confirmDeleteAct')))
            deleteDoc(doc(db, 'activities', el.dataset.del));
        }));
    }

    document.getElementById('addActBtn').addEventListener('click', async () => {
      if (!currentTripId) return;
      const name = document.getElementById('actName').value.trim();
      if (!name) { alert(t('actNameRequired')); return; }
      await addDoc(collection(db, 'activities'), {
        tripId: currentTripId, name,
        date: document.getElementById('actDate').value,
        assignedTo: document.getElementById('actWho').value || null,
        done: false, createdBy: user.uid, createdAt: serverTimestamp()
      });
      ['actName', 'actDate'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('actWho').value = '';
    });

    document.getElementById('deleteTripBtn').addEventListener('click', async () => {
      if (!currentTripId) return;
      if (!confirm(t('confirmDeleteTrip'))) return;
      const acts = await getDocs(
        query(collection(db, 'activities'), where('tripId', '==', currentTripId)));
      for (const a of acts.docs) await deleteDoc(a.ref);
      await deleteDoc(doc(db, 'trips', currentTripId));
      closeTrip();
    });

    /* ════════════════════════════════════════════════════════════
       Plan section — link / view custom HTML plan per trip
    ════════════════════════════════════════════════════════════ */

    // Render the plan section inside trip detail
    function renderPlanSection(planUrl) {
      const display = document.getElementById('planLinkDisplay');
      const editDiv = document.getElementById('planLinkEdit');
      editDiv.style.display = 'none';

      if (planUrl) {
        // Shorten long URLs for display
        const short = planUrl.length > 50 ? '…' + planUrl.slice(-40) : planUrl;
        display.innerHTML = `
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px">
            ${t('planLinked')} <em>${escHtml(short)}</em>
          </div>
          <div class="action-row">
            <button class="pill-btn" id="openPlanBtn">${t('viewPlan')}</button>
            <button class="pill-btn" id="editPlanBtn">${t('editPlan')}</button>
            <button class="pill-btn" id="removePlanBtn"
                    style="color:var(--danger,#e74c3c)">${t('removePlan')}</button>
          </div>`;

        document.getElementById('openPlanBtn').addEventListener('click', () =>
          openPlanModal(planUrl, currentTripData?.name || ''));

        document.getElementById('editPlanBtn').addEventListener('click', () => {
          document.getElementById('planUrlInput').value = planUrl;
          editDiv.style.display = '';
          display.style.display = 'none';
        });

        document.getElementById('removePlanBtn').addEventListener('click', async () => {
          if (!currentTripId) return;
          await updateDoc(doc(db, 'trips', currentTripId), { planUrl: '' });
          if (currentTripData) currentTripData.planUrl = '';
          renderPlanSection(null);
          // also re-render trip list so button disappears
          renderTrips(cachedTrips);
        });
        display.style.display = '';
      } else {
        display.innerHTML = `
          <button class="pill-btn" id="linkPlanBtn">${t('linkPlan')}</button>`;
        document.getElementById('linkPlanBtn').addEventListener('click', () => {
          document.getElementById('planUrlInput').value = '';
          editDiv.style.display = '';
          display.style.display = 'none';
        });
      }
    }

    // Save plan URL to Firestore
    document.getElementById('savePlanBtn').addEventListener('click', async () => {
      if (!currentTripId) return;
      const url = document.getElementById('planUrlInput').value.trim();
      await updateDoc(doc(db, 'trips', currentTripId), { planUrl: url });
      if (currentTripData) currentTripData.planUrl = url;
      document.getElementById('planLinkEdit').style.display = 'none';
      document.getElementById('planLinkDisplay').style.display = '';
      renderPlanSection(url || null);
      renderTrips(cachedTrips);
    });

    document.getElementById('cancelPlanBtn').addEventListener('click', () => {
      document.getElementById('planLinkEdit').style.display = 'none';
      document.getElementById('planLinkDisplay').style.display = '';
    });

    // Open the plan viewer modal
    function openPlanModal(url, title) {
      document.getElementById('planModalTitle').textContent = title || '';
      document.getElementById('planModalFullBtn').href = url;
      document.getElementById('planModalFullBtn').textContent = t('openFullScreen');
      document.getElementById('planFrame').src = url;
      document.getElementById('planModal').classList.add('visible');
    }

    document.getElementById('planModalClose').addEventListener('click', () => {
      document.getElementById('planModal').classList.remove('visible');
      document.getElementById('planFrame').src = '';
    });

    /* ════════════════════════════════════════════════════════════
       Start
    ════════════════════════════════════════════════════════════ */
    init();
  </script>
</body>
</html>
