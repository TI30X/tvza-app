<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0B1B2A" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/firn.svg" />
  <link rel="apple-touch-icon" href="../assets/icons/firn-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/kit.css?v=35" />
  <link rel="stylesheet" href="../assets/css/legacy.css?v=1" />
  <link rel="stylesheet" href="../assets/css/feature/woche.css?v=3" />
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=27" defer></script>
  <title data-i18n="tr.seitentitel">Training — Firn</title>
  <!-- Der Bereich Training liest den Plan der GRUPPE.

       Bis v.35.26.0 war das hier eine eigene Welt: eigener Import,
       eigener Speicher unter users/{uid}/trainingLogs, eigener Player,
       900 Zeilen in einem Inline-Modul. Was ein Athlet hier abhakte,
       sah sein Trainer nie, und die Gruppe hatte denselben Plan ein
       zweites Mal. Jetzt zeigt diese Seite die Woche aus den Plaenen
       aller Gruppen, in denen man ist — mit demselben Baustein wie die
       Gruppe und demselben Player dahinter.

       Kein style-Block, kein Inline-Modul, kein style-Attribut: die
       Seiten-Invariante aus CLAUDE.md. -->
</head>
<body class="app">

  <div class="offline-banner" id="offlineBanner" hidden data-i18n="br.offline">Offline — Änderungen werden später gespeichert.</div>

  <main class="main" id="main">

    <!-- Noch keine Gruppe, oder noch kein Plan. Der Satz sagt, woher
         das Training kommt, und der Knopf fuehrt dorthin. Beide traegt
         der Code, darum ohne data-i18n. -->
    <section class="section" id="secOhne" hidden>
      <div class="hint">
        <div class="hint__text" id="ohneText"></div>
      </div>
      <a class="b b--primary b--block" id="lnkGruppe" href="./gruppe.html"></a>
    </section>

    <!-- Die Woche aus den Plaenen aller Gruppen, mit ihren Terminen —
         derselbe Kalender wie auf der Gruppenseite (feature/woche/).
         Den Namen ueber der Woche setzt der Code: eine Gruppe oder
         "Aus deinen Gruppen". -->
    <section class="section" id="secWoche" hidden>
      <div class="marke"><span id="wocheGruppe"></span></div>
      <div class="agenda" id="agenda">
        <div class="spinner" data-fx-rows="3" data-i18n="common.laden">Lade…</div>
      </div>
    </section>

  </main>

  <script type="module" src="../assets/js/feature/training/training.js?v=20"></script>
</body>
</html>
