<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0B1B2A" />
  <link rel="icon" href="../assets/icons/icon-192.png" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/kit.css?v=1" />
  <link rel="stylesheet" href="../assets/css/legacy.css?v=1" />
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=26" defer></script>
  <title>Gruppe — TVZA</title>
  <!-- Kein style-Block, kein Inline-Modul, kein style-Attribut, keine
       Hex-Farbe ausser theme-color: die Seiten-Invariante aus CLAUDE.md. -->
</head>
<body class="app">

  <div class="offline-banner" id="offlineBanner" hidden data-i18n="br.offline">Offline — Änderungen werden später gespeichert.</div>

  <header class="appbar">
    <div class="appbar__inner">
      <div class="appbar__spacer">
        <div class="appbar__greet" id="grpName">Gruppe</div>
        <div class="appbar__date" id="grpMeta" hidden></div>
      </div>
    </div>
  </header>

  <main class="main" id="main">

    <!-- Der Bildschirm, den jemand ohne Gruppe zuerst sieht. Er sagt
         nicht "nichts vorhanden", sondern zeigt die zwei Wege hinein.
         Ein leerer Tab wäre ein Grund, nicht wiederzukommen. -->
    <section class="section" id="secLeer" hidden>
      <div class="hint">
        <div class="hint__text" id="leerText">
          Eine Gruppe ist der Ort, an dem ihr Termine, Pläne und Nachrichten
          teilt — als Familie oder als Kader.
        </div>
      </div>
      <div class="rows">
        <button class="b b--primary b--block" id="btnNeu" type="button">Gruppe erstellen</button>
      </div>
    </section>

    <!-- Der Umschalter steht nur da, wenn es wirklich etwas zu wechseln
         gibt. Ein Auswahlfeld mit einem einzigen Eintrag ist eine Lüge. -->
    <section class="section" id="secWechsel" hidden>
      <div class="marke">Aktive Gruppe</div>
      <select class="form-select" id="grpWahl" aria-label="Gruppe wechseln"></select>
    </section>

    <!-- Termine. Training, Lager, Rennen — drei Arten, weil sie sich
         wirklich verschieden verhalten. Die Farbe ist hier keine
         Dekoration, sondern die Information. -->
    <section class="section" id="secTermine" hidden>
      <div class="marke">Termine</div>
      <div class="rows" id="listTermine"></div>
      <button class="b b--secondary b--block" id="btnTermin" type="button" hidden>Termin hinzufügen</button>
    </section>

    <!-- Das Formular steht auf derselben Seite statt in einem Dialog:
         ein Rennen hat sechs Felder, und ein Dialog, der auf dem Handy
         die halbe Höhe frisst, macht daraus eine Rutschpartie. -->
    <section class="section" id="secForm" hidden>
      <div class="form-card">
        <div class="form-title">Neuer Termin</div>

        <div class="form-group">
          <label class="form-label" for="fArt">Art</label>
          <select class="form-select" id="fArt">
            <option value="training">Training</option>
            <option value="lager">Trainingslager</option>
            <option value="rennen">Rennen</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="fTitel">Titel</label>
          <input class="form-input" id="fTitel" type="text" maxlength="120" placeholder="z.B. Kraft Beine" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="fVon">Von</label>
            <input class="form-input" id="fVon" type="date" />
          </div>
          <div class="form-group" id="grpBis">
            <label class="form-label" for="fBis">Bis</label>
            <input class="form-input" id="fBis" type="date" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" id="grpZeit">
            <label class="form-label" for="fZeit">Uhrzeit</label>
            <input class="form-input" id="fZeit" type="time" />
          </div>
          <div class="form-group" id="grpDisziplin" hidden>
            <label class="form-label" for="fDisziplin">Disziplin</label>
            <select class="form-select" id="fDisziplin">
              <option value="">—</option>
              <option value="SL">Slalom</option>
              <option value="RS">Riesenslalom</option>
              <option value="SG">Super-G</option>
              <option value="DH">Abfahrt</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="fOrt">Ort</label>
          <input class="form-input" id="fOrt" type="text" maxlength="80" placeholder="kann leer bleiben" />
        </div>

        <p class="empty-hint" id="formFehler" hidden></p>

        <button class="b b--primary b--block" id="btnSpeichern" type="button">Speichern</button>
        <button class="b b--secondary b--block" id="btnAbbrechen" type="button">Abbrechen</button>
      </div>
    </section>

    <!-- Ein Termin von nahem. Für Athleten die Zusage, für die Leitung
         das Ergebnis — und beides an derselben Stelle, weil ein Rennen
         genau das ist: etwas mit einem Vorher und einem Nachher. -->
    <section class="section" id="secDetail" hidden>
      <div class="form-card">
        <div class="form-title" id="dTitel">—</div>
        <p class="empty-hint" id="dMeta"></p>

        <div class="form-group">
          <div class="form-label">Deine Antwort</div>
          <div class="rows" id="zusageKnoepfe">
            <button class="b b--secondary b--block" type="button" data-antwort="ja">Ja, ich komme</button>
            <button class="b b--secondary b--block" type="button" data-antwort="vielleicht">Vielleicht</button>
            <button class="b b--secondary b--block" type="button" data-antwort="nein">Nein</button>
          </div>
          <p class="empty-hint" id="dZusagen"></p>
        </div>

        <div id="grpErgebnis" hidden>
          <div class="form-title">Ergebnis</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="eRang">Rang</label>
              <input class="form-input" id="eRang" type="number" min="1" max="999" inputmode="numeric" />
            </div>
            <div class="form-group">
              <label class="form-label" for="eZeit">Laufzeit</label>
              <input class="form-input" id="eZeit" type="text" maxlength="12" placeholder="1:23.45" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="ePunkte">FIS-Punkte</label>
            <input class="form-input" id="ePunkte" type="text" maxlength="10" placeholder="kann leer bleiben" />
          </div>
          <button class="b b--primary b--block" id="btnErgebnis" type="button">Ergebnis speichern</button>
        </div>

        <button class="b b--secondary b--block" id="btnZurueck" type="button">Zurück</button>
        <button class="b b--danger b--block" id="btnLoeschen" type="button" hidden>Termin löschen</button>
      </div>
    </section>

    <section class="section" id="secMitglieder" hidden>
      <div class="marke" id="mitgliederTitel">Mitglieder</div>
      <div class="rows" id="listMitglieder">
        <div class="spinner" data-fx-rows="3" data-i18n="common.laden">Lade…</div>
      </div>
    </section>

    <section class="section" id="secAktionen" hidden>
      <button class="b b--secondary b--block" id="btnEinladen" type="button">Einladungscode kopieren</button>
    </section>

  </main>

  <script type="module" src="../assets/js/feature/gruppe/gruppe.js?v=1"></script>
</body>
</html>
