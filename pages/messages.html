<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#5a3aa6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/i18n.js?v=1"></script>
  <link rel="stylesheet" href="../assets/css/kit.css?v=29" />
  <link rel="stylesheet" href="../assets/css/legacy.css?v=1" />
  <title>Nachrichten — Firn</title>
  <link rel="stylesheet" href="../assets/css/ui-fx.css?v=15" />
  <script src="../assets/js/ui-fx.js?v=26" defer></script>

  <style>
    body.dm { --accent:#6b46c1; --accent-hover:#5a3aa6; --accent-bg:rgba(107,70,193,.14); }
    html[data-theme="dark"] body.dm { --accent:#b9a4ec; --accent-hover:#ccbdf2; --accent-bg:rgba(107,70,193,.26); }
    .dm .accent-bar--dm { background:linear-gradient(90deg,#3c2a73,#6b46c1 55%,#9a7fe6); height:4px; }
    .dm .main { display:flex; flex-direction:column; gap:12px; min-height:0; }
    /* Im Thread gehört der untere Rand dem Eingabefeld, nicht dem
       Seitenabstand — sonst schwebt es über der Navileiste. */
    body.dm-thread .main { padding-bottom:10px; }

    /* conversation list */
    .dm-newbtn { display:flex; align-items:center; justify-content:center; gap:8px; }
    .dm-list { display:flex; flex-direction:column; gap:8px; }
    .dm-conv { display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:11px; align-items:center;
      border:1px solid var(--border); background:var(--surface); border-radius:var(--r2); padding:11px 13px; cursor:pointer;
      transition:transform .12s ease, border-color .12s ease; text-align:left; width:100%; font:inherit; color:inherit; }
    .dm-conv:hover { border-color:var(--accent); }
    .dm-ava { width:42px; height:42px; border-radius:var(--r-pill); display:grid; place-items:center; font-weight:700; font-size:16px;
      background:var(--accent-bg); color:var(--accent); }
    .dm-conv-main { min-width:0; display:flex; flex-direction:column; }
    .dm-conv-name { font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:7px; min-width:0; }
    .dm-conv-last { color:var(--ink-soft); font-size:12.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; min-width:0; }
    .dm-conv-meta { display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
    .dm-time { color:var(--ink-soft); font-size:11px; white-space:nowrap; }
    .dm-badge { min-width:20px; height:20px; padding:0 6px; border-radius: var(--r-pill); background:var(--accent); color:#fff;
      font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
    .dm-empty { border:1px dashed var(--border); border-radius:var(--r2); padding:22px 16px; text-align:center; color:var(--ink-soft); font-size:13px; }

    /* thread */
    /* Der Verlauf nimmt den freien Platz, das Eingabefeld sitzt darum
       immer am unteren Rand — auch in einer Unterhaltung ohne einzige
       Nachricht. Vorher hatte der Verlauf eine feste Höhe von 50vh und
       schob das Feld in die Bildschirmmitte. */
    #threadView { display:none; flex-direction:column; gap:0; flex:1; min-height:0; }
    .dm-thread-head { display:flex; align-items:center; gap:10px; padding:4px 2px 10px; }
    .dm-thread-head .dm-ava { width:36px; height:36px; font-size:14px; }
    .dm-thread-name { font-weight:700; font-size:16px; }
    .dm-thread-back { background:none; border:0; cursor:pointer; color:var(--accent); font:inherit; font-weight:700;
      display:inline-flex; align-items:center; gap:4px; padding:6px 4px; }
    .dm-msgs { display:flex; flex-direction:column; gap:7px; padding:12px 2px; flex:1; min-height:0; overflow-y:auto; }
    /* Eine leere Unterhaltung soll den Platz trotzdem füllen, damit der
       Hinweis nicht am oberen Rand klebt. */
    .dm-msgs .dm-empty { margin:auto; }
    .dm-day-sep { align-self:center; font-size:11px; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--border);
      border-radius: var(--r-pill); padding:2px 11px; margin:8px 0 2px; }
    .dm-bubble { max-width:80%; padding:8px 12px; border-radius: var(--r-panel); font-size:14px; line-height:1.4; word-wrap:break-word; white-space:pre-wrap; position:relative; }
    .dm-bubble .b-time { display:block; font-size:10px; opacity:.65; margin-top:3px; text-align:right; }
    .dm-einladung { color:inherit; font-weight:700; text-decoration:underline; overflow-wrap:anywhere; }
    .dm-bubble.me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
    .dm-bubble.them { align-self:flex-start; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); border-bottom-left-radius:5px; }
    .dm-typing { font-size:12px; color:var(--ink-soft); padding:0 2px 4px; display:flex; align-items:center; gap:6px; min-height:18px; }
    .dm-typing-dots { display:inline-flex; gap:2px; }
    .dm-typing-dots span { width:4px; height:4px; border-radius:var(--r-pill); background:var(--ink-soft); animation:dmTypingBounce 1.1s infinite ease-in-out; }
    .dm-typing-dots span:nth-child(2) { animation-delay:.15s; }
    .dm-typing-dots span:nth-child(3) { animation-delay:.3s; }
    @keyframes dmTypingBounce { 0%, 60%, 100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-3px); opacity:1; } }
    .dm-compose { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:end; padding-top:10px; border-top:1px solid var(--border); }
    .dm-compose textarea { width:100%; resize:none; font:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--border);
      border-radius: var(--r-row); background:var(--surface-2); color:var(--ink); max-height:120px; min-height:44px; line-height:1.35; }
    .dm-compose textarea:focus { outline:none; border-color:var(--accent); }
    .dm-send { min-width:46px; min-height:46px; border-radius:var(--r-pill); border:0; background:var(--accent); color:#fff; cursor:pointer;
      display:grid; place-items:center; transition:filter .15s ease, transform .1s ease; }
    .dm-send:hover { filter:brightness(1.06); } .dm-send:active { transform:scale(.95); }
    .dm-send:disabled { opacity:.4; cursor:default; }

    /* user picker modal */
    .dm-userlist { display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow-y:auto; margin-top:4px; }
    .dm-user { display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r1);
      background:var(--surface); cursor:pointer; font:inherit; color:inherit; text-align:left; width:100%; }
    .dm-user:hover { border-color:var(--accent); background:var(--accent-bg); }
    .dm-user small { display:block; color:var(--ink-soft); font-size:11.5px; }
    /* v.35.62.0: zu zweit oder mit Häkchen für einen Gruppenchat */
    .dm-ava--klein { width:36px; height:36px; font-size:13px; flex:none; }
    .dm-user__wer { flex:1; min-width:0; }
    .dm-user__name { font-weight:700; }
    .dm-user__haken { width:22px; height:22px; flex:none; border:1.5px solid var(--border); border-radius:var(--r-pill); }
    .dm-user.is-an { border-color:var(--accent); background:var(--accent-bg); }
    .dm-user.is-an .dm-user__haken { background:var(--accent); border-color:var(--accent);
      box-shadow: inset 0 0 0 4px var(--surface); }
    .dm-user-hinweis { margin:6px 2px 0; font-size:12.5px; color:var(--ink-soft); }
    .dm-empty--still { border:0; }

    /* v.35.61.0: Gruppenchats, der Chat jeder Gruppe, stumm, Termin-Karten */
    .dm-kopfknoepfe { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .dm-ava--gruppe { background:var(--tint, var(--accent-bg)); color:var(--deep, var(--accent)); font-size:13px; }
    .dm-ava--runde svg { width:20px; height:20px; }
    .dm-stumm { display:inline-flex; color:var(--ink-soft); }
    .dm-stumm svg { width:14px; height:14px; }
    .dm-punkt { width:10px; height:10px; border-radius:var(--r-pill); background:var(--accent); }
    .dm-conv.is-stumm .dm-badge, .dm-conv.is-stumm .dm-punkt { background:var(--ink-soft); }
    .dm-thread-wer { flex:1; min-width:0; display:flex; flex-direction:column; }
    .dm-thread-sub { font-size:12px; color:var(--ink-soft); }
    .dm-thread-sub:empty { display:none; }
    .dm-kopf-knopf { width:40px; height:40px; border:0; border-radius:var(--r-pill); background:transparent; color:var(--ink-soft);
      display:grid; place-items:center; cursor:pointer; }
    .dm-kopf-knopf:hover { background:var(--accent-bg); color:var(--ink); }
    .dm-kopf-knopf[aria-pressed="true"] { color:var(--accent); }
    .dm-sender { display:block; font-size:11px; font-weight:700; opacity:.75; margin-bottom:2px; }
    .dm-compose { grid-template-columns:auto minmax(0,1fr) auto; }
    .dm-termin-knopf { min-width:46px; min-height:46px; border-radius:var(--r-pill); border:1px solid var(--border); background:var(--surface);
      color:var(--ink-soft); display:grid; place-items:center; cursor:pointer; }
    .dm-termin-knopf:hover { color:var(--accent); border-color:var(--accent); }
    .dm-karte { display:flex; flex-direction:column; gap:2px; margin:2px 0 4px; padding:9px 11px; border-radius:12px;
      background:var(--surface); color:var(--ink); border:1px solid var(--border); border-left:4px solid var(--accent); white-space:normal; }
    .dm-karte__kopf { font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
    .dm-karte__titel { font-size:14.5px; }
    .dm-karte__wann { font-size:12.5px; color:var(--ink-soft); }
    .dm-karte__link { align-self:flex-start; margin-top:4px; font-size:12.5px; font-weight:700; color:var(--accent); text-decoration:none; }
  </style>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/firn.svg" />
  <link rel="apple-touch-icon" href="../assets/icons/firn-192.png" />
</head>
<body class="dm">

  <div class="app">
    <div class="offline-banner" id="offlineBanner"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7L9 11l-2 3H4l1 3 3 1 1-3 3-2 3.1 5.1a1 1 0 0 0 1.7-.9z"/></svg> Offline – Nachrichten werden gesendet, sobald du wieder online bist</div>

    <header class="appbar appbar--bereich" data-bereich="msg">
      <div class="appbar__inner">
        <a href="../index.html" class="appbar__btn back-btn" aria-label="Zurück" data-i18n-attr="aria-label:a11y.zurueck"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
        <span class="appbar__title" data-i18n="mod.dm.name">Nachrichten</span>
        <span class="appbar__end">
        <button class="appbar__btn" id="themeToggle" title="Theme wechseln" data-i18n-attr="title:pg.theme"></button>
        </span>
      </div>
      <div class="appbar__accent"></div>
    </header>
    <div class="accent-bar accent-bar--dm"></div>

    <main class="main">

      <!-- LIST VIEW -->
      <div id="listView">
        <!-- Zu zweit oder als Gruppenchat (v.35.61.0). Den Chat jeder Firn-
             Gruppe gibt es von selbst — er steht unten in der Liste. -->
        <div class="dm-kopfknoepfe">
          <button class="btn btn-primary btn-block dm-newbtn" id="newChatBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="msg.neu">Neue Unterhaltung</span>
          </button>
          <button class="btn btn-secondary btn-block dm-newbtn" id="newRundeBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .3 5.5 2.7 5.5 5.8"/></svg>
            <span data-i18n="msg.gruppenchat">Gruppenchat</span>
          </button>
        </div>
        <div id="convList" class="dm-list" style="margin-top:12px"><div class="spinner" data-i18n="common.laden">Lade…</div></div>
      </div>

      <!-- THREAD VIEW -->
      <div id="threadView">
        <div class="dm-thread-head">
          <button class="dm-thread-back" id="threadBack">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="dm-ava" id="threadAva">?</div>
          <div class="dm-thread-wer">
            <div class="dm-thread-name" id="threadName">…</div>
            <div class="dm-thread-sub" id="threadSub"></div>
          </div>
          <!-- Stumm (v.35.61.0): keine Zahl am Tab, kein Punkt, keine Meldung. -->
          <button class="dm-kopf-knopf" id="threadStumm" type="button" aria-pressed="false" title="Stummschalten" aria-label="Stummschalten" data-i18n-attr="title:msg.stumm;aria-label:msg.stumm"></button>
        </div>
        <div class="dm-msgs" id="msgs"></div>
        <div class="dm-typing" id="typingIndicator" hidden>
          <span class="dm-typing-dots"><span></span><span></span><span></span></span>
          <span id="typingText"></span>
        </div>
        <div class="dm-compose">
          <!-- Einen Termin als Karte teilen (v.35.61.0). -->
          <button class="dm-termin-knopf" id="terminTeilen" type="button" title="Termin teilen" aria-label="Termin teilen" data-i18n-attr="title:msg.terminTeilen;aria-label:msg.terminTeilen">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>
          </button>
          <textarea id="msgInput" rows="1" placeholder="Nachricht schreiben…" maxlength="2000" data-i18n-attr="placeholder:msg.schreiben"></textarea>
          <button class="dm-send" id="sendBtn" title="Senden" disabled data-i18n-attr="title:msg.senden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

    </main>

    <footer class="tvz-footer">
      <span class="firn">Fir<b>n</b></span>
    </footer>
  </div>

  <!-- New-chat user picker -->
  <div class="modal-backdrop" id="userModal">
    <div class="modal">
      <!-- Den Titel setzt der Code (zu zweit oder Gruppenchat) — darum ohne data-i18n. -->
      <div class="modal-title" id="userTitel">Wem schreiben?</div>
      <input class="form-input" id="userSearch" type="text" inputmode="email" placeholder="Name, Gruppe oder E-Mail-Adresse" autocomplete="off" data-i18n-attr="placeholder:msg.suchenAdresse" />
      <p class="dm-user-hinweis" id="userHinweis" hidden></p>
      <div class="dm-userlist" id="userList"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="userCancel" data-i18n="a11y.schliessen">Schliessen</button>
        <button class="btn btn-primary" id="userWeiter" type="button" hidden disabled>Weiter</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, requireAuth, wireOfflineBanner, escHtml, getProfile, reportClientError, imKreis } from '../assets/js/firebase-config.js';
    import { kontakte } from '../assets/js/groups.js';
    import { nameVon, personPerEmail as perAdresse, istEmail as istAdresse } from '../assets/js/personen.js';
    import { sucheBekannte } from '../assets/js/bekannte.js';
    import { codeSauber, einloesen, APP_WURZEL } from '../assets/js/einladung.js';
    import { meldung, eingabe, waehle } from '../assets/js/dialog.js';
    import { formatiert } from '../assets/js/formatierung.js';
    import { beobachteUnterhaltungen, standSetzen, gruppenNachricht } from '../assets/js/chat-stand.js';
    import { standSchluessel, terminKarte, karteText, rundePruefen, RUNDE_MIN, TITEL_MAX } from '../assets/js/chat-modell.js';
    import { gruppenStil, gruppenFarbe, kuerzel } from '../assets/js/gruppenwahl.js';
    import { ladeTermine } from '../assets/js/groups.js';
    import { artWort, istAbgesagt } from '../assets/js/termine.js';
    import {
      collection, doc, addDoc, setDoc, updateDoc, onSnapshot,
      query, orderBy, where, serverTimestamp, increment, limitToLast
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    const tOr = (k, d, v) => window.TVZAI18n?.tOr(k, d, v) ?? String(d).replace(/\{(\w+)\}/g, (g, n) => v?.[n] ?? g);

    wireOfflineBanner();
    const user = await requireAuth('../login.html');
    const me = user.uid;
    const profile = await getProfile(user);
    const myName = profile.displayName || user.email || 'Ich';

    const $ = id => document.getElementById(id);
    const convId = (a, b) => [a, b].sort().join('__');
    /* Sichtbar: der Tab ist vorne UND der Router hat den Chat nicht geparkt. */
    const sichtbar = () => !document.hidden && !document.documentElement.hasAttribute('data-tvza-geparkt');
    const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase() || '?';
    const otherOf = data => (data.participants || []).find(u => u !== me);

    /* ── time helpers ── */
    const toDate = ts => ts && typeof ts.toDate === 'function' ? ts.toDate() : (ts instanceof Date ? ts : null);
    function relTime(ts) {
      const d = toDate(ts); if (!d) return '';
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return 'jetzt';
      if (diff < 3600) return Math.floor(diff/60) + ' Min';
      const today = new Date(); today.setHours(0,0,0,0);
      if (d >= today) return d.toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' });
      const yest = new Date(today); yest.setDate(yest.getDate()-1);
      if (d >= yest) return 'Gestern';
      return d.toLocaleDateString('de-CH', { day:'numeric', month:'short' });
    }
    const clockTime = ts => { const d = toDate(ts); return d ? d.toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' }) : ''; };
    const dayKey = ts => { const d = toDate(ts); return d ? d.toLocaleDateString('de-CH', { weekday:'long', day:'numeric', month:'long' }) : ''; };

    /* ════ Die Unterhaltungen (live, v.35.61.0) ════
       Zu zweit, Gruppenchats (dms, art 'runde') und der Chat jeder Gruppe
       (groups/{gid}/chat) in EINER Liste — chat-stand.js liest, was die
       Leiste und Start ebenso brauchen, chat-modell.js ordnet. */
    let convs = [];          // die Unterhaltungen zu zweit (für die Personenwahl)
    let alleDms = [];        // dazu die Gruppenchats
    let eintraege = [];      // die Liste, wie sie gezeichnet wird
    let meineGruppen = [];
    beobachteUnterhaltungen(me, (liste, { dms, gruppen }) => {
      alleDms = dms;
      convs = dms.filter(c => c.art !== 'runde');
      meineGruppen = gruppen;
      eintraege = liste;
      renderConvList();
      if (aktiv) stummZeichnen();
    });

    const RUNDE_SYMBOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .3 5.5 2.7 5.5 5.8"/></svg>';
    const STUMM_SYMBOL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18.6 13A17.9 17.9 0 0 1 18 8"/><path d="M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.3-5"/><path d="M2 2l20 20"/></svg>';
    const GLOCKE_SYMBOL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';

    function avatarHtml(u, klein = false) {
      if (u.art === 'gruppe') {
        return `<span class="dm-ava dm-ava--gruppe" style="${escHtml(gruppenStil(meineGruppen)(u.id))}">${escHtml(kuerzel(u.name))}</span>`;
      }
      if (u.art === 'runde') return `<span class="dm-ava dm-ava--runde">${RUNDE_SYMBOL}</span>`;
      return `<span class="dm-ava">${escHtml(initials(u.name))}</span>`;
    }

    function renderConvList() {
      const wrap = $('convList');
      if (!eintraege.length) {
        wrap.innerHTML = `<div class="dm-empty">Noch keine Unterhaltungen.<br>Tippe oben auf „Neue Unterhaltung", um jemandem zu schreiben.</div>`;
        return;
      }
      wrap.innerHTML = eintraege.map((u, i) => {
        const zahl = u.ungelesen && !u.punkt ? `<span class="dm-badge">${u.ungelesen > 99 ? '99+' : u.ungelesen}</span>` : '';
        const punkt = u.ungelesen && u.punkt ? '<span class="dm-punkt" aria-label="Neu"></span>' : '';
        return `<button class="dm-conv${u.stumm ? ' is-stumm' : ''}" type="button" data-eintrag="${i}">
          ${avatarHtml(u)}
          <span class="dm-conv-main">
            <span class="dm-conv-name">${escHtml(u.name)}${u.stumm ? `<span class="dm-stumm" title="Stumm">${STUMM_SYMBOL}</span>` : ''}</span>
            <span class="dm-conv-last">${escHtml(u.vorschau || (u.art === 'gruppe' ? 'Der Chat eurer Gruppe' : '—'))}</span>
          </span>
          <span class="dm-conv-meta">
            <span class="dm-time">${u.zeit ? relTime(new Date(u.zeit)) : ''}</span>
            ${zahl}${punkt}
          </span>
        </button>`;
      }).join('');
    }
    $('convList').addEventListener('click', e => {
      const knopf = e.target.closest('[data-eintrag]');
      const u = knopf && eintraege[Number(knopf.dataset.eintrag)];
      if (!u) return;
      if (u.art === 'dm') openThread(u.andere, u.name);
      else oeffne(u);
    });

    /* ════ Thread (live) ════ */
    let aktiv = null;                 // { art, id, name, andere?, leute? }
    let activeOther = null, activeName = '', msgUnsub = null;
    let convUnsub = null, typingHideTimer = null;
    // Reine Boolean-Flag statt Zeitstempel-Vergleich: ein Vergleich von serverTimestamp()
    // gegen das lokale Date.now() ist anfällig für Uhrzeit-Drift zwischen den Geräten.
    //
    // Die Gegenseite hält "true" per Herzschlag alle TYPING_BEAT_MS wach,
    // solange wirklich getippt wird. Dieses Netz hier fängt nur den Fall
    // ab, dass sie verschwindet, ohne "false" schreiben zu können — also
    // Verbindungsabbruch oder hart geschlossener Tab. Es muss deutlich
    // länger sein als der Herzschlag: war es kürzer, blendete der
    // Indikator mitten im Schreiben aus und beim nächsten Signal wieder
    // ein, was wie zufälliges Flackern aussah.
    // Ein "hat aufgehört" meldet der Browser nicht — es lässt sich nur
    // daran erkennen, dass eine Weile nichts mehr kam. Dieses Fenster
    // ist darum so kurz wie möglich gehalten: 1,2s nach dem letzten
    // Anschlag gilt man als fertig, nicht erst nach mehreren Sekunden.
    const TYPING_BEAT_MS = 2000;
    const TYPING_IDLE_MS = 1200;
    const TYPING_AUTO_HIDE_MS = TYPING_BEAT_MS * 3;
    function showTyping(show, name) {
      const el = $('typingIndicator');
      if (typingHideTimer) { clearTimeout(typingHideTimer); typingHideTimer = null; }
      if (show) {
        $('typingText').textContent = `${name} tippt…`; el.hidden = false;
        typingHideTimer = setTimeout(() => { el.hidden = true; }, TYPING_AUTO_HIDE_MS);
      } else el.hidden = true;
    }
    /* Zu zweit — wie bisher, auch aus dem Direktlink (?to=). */
    function openThread(other, name) {
      oeffne({ art: 'dm', id: convId(me, other), andere: other, name });
    }
    const schluesselVon = u => standSchluessel(u.art === 'gruppe' ? 'gruppe' : 'dm', u.id);

    /* Gelesen: zu zweit und in Gruppenchats die Zahl am Dokument, im Chat
       einer Gruppe der eigene Stand. */
    function gelesen() {
      if (!aktiv || !sichtbar()) return;
      if (aktiv.art === 'gruppe') standSetzen(me, schluesselVon(aktiv), { gelesen: serverTimestamp() }).catch(() => {});
      else updateDoc(doc(db, 'dms', aktiv.id), { ['unread.' + me]: 0, ['lastRead.' + me]: serverTimestamp() }).catch(() => {});
    }

    function stummZeichnen() {
      const u = eintraege.find(e => e.art === aktiv?.art && e.id === aktiv?.id);
      const stumm = !!u?.stumm;
      const knopf = $('threadStumm');
      knopf.innerHTML = stumm ? STUMM_SYMBOL : GLOCKE_SYMBOL;
      knopf.setAttribute('aria-pressed', String(stumm));
      const wort = stumm ? tOr('msg.laut', 'Wieder benachrichtigen') : tOr('msg.stumm', 'Stummschalten');
      knopf.title = wort;
      knopf.setAttribute('aria-label', wort);
    }
    $('threadStumm').addEventListener('click', async () => {
      if (!aktiv) return;
      const u = eintraege.find(e => e.art === aktiv.art && e.id === aktiv.id);
      try { await standSetzen(me, schluesselVon(aktiv), { stumm: !u?.stumm }); }
      catch (err) { reportClientError('messages-stumm', err); }
    });

    /* Die Pille des Assistenten lebt im obersten Dokument und läge am
       Handy genau über dem Eingabefeld — solange eine Unterhaltung offen
       und zu sehen ist, tritt sie zurück (v.35.61.0). */
    function pilleVerbergen(an) {
      try { window.top.document.body.classList.toggle('chat-offen', !!an); } catch { /* fremdes Dokument: nichts zu tun */ }
    }
    window.addEventListener('pagehide', () => pilleVerbergen(false));

    function oeffne(u) {
      pilleVerbergen(true);
      if (msgUnsub) { msgUnsub(); msgUnsub = null; }
      if (convUnsub) { convUnsub(); convUnsub = null; }
      aktiv = u;
      activeOther = u.art === 'dm' ? u.andere : null;
      activeName = u.name;
      $('threadName').textContent = u.name;
      $('threadSub').textContent = u.art === 'runde'
        ? tOr('msg.personen', '{n} Personen', { n: u.leute || (alleDms.find(c => c.id === u.id)?.participants || []).length })
        : u.art === 'gruppe' ? tOr('msg.chatDerGruppe', 'Chat der Gruppe') : '';
      $('threadAva').outerHTML = avatarHtml(u).replace('class="dm-ava', 'id="threadAva" class="dm-ava');
      stummZeichnen();
      $('listView').style.display = 'none';
      $('threadView').style.display = 'flex';
      document.body.classList.add('dm-thread');
      /* Entwurf der vorherigen Unterhaltung nicht mitnehmen. */
      input.value = ''; autoSize(); sendBtn.disabled = true;
      $('msgs').innerHTML = `<div class="spinner">Lade…</div>`;
      showTyping(false);
      /* Eigenes Flag beim Betreten zurücksetzen. Solange der Fehler oben
         drin war (setDoc ohne Punktpfad), blieb in jeder Unterhaltung
         ein typing.<uid> = true stehen — beim Öffnen sah die Gegenseite
         darum sofort "tippt…", ohne dass jemand tippte. Das heilt den
         Altbestand beim nächsten Betreten. */
      writeTyping(false);
      try { history.pushState({ thread: true }, ''); } catch(e){}
      gelesen();

      const sammlung = u.art === 'gruppe'
        ? query(collection(db, 'groups', u.id, 'chat'), orderBy('createdAt', 'asc'), limitToLast(300))
        : query(collection(db, 'dms', u.id, 'messages'), orderBy('createdAt', 'asc'));
      msgUnsub = onSnapshot(sammlung, snap => {
        const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMessages(msgs);
        /* Eine angekommene Nachricht beendet das Tippen — unabhängig
           davon, welches der beiden Signale zuerst eintrifft. Sonst
           stand der Indikator noch unter einer bereits gelesenen
           Nachricht, bis das Flag nachkam. */
        const last = msgs[msgs.length - 1];
        if (last && last.sender === activeOther) showTyping(false);
        // keep marking read while the thread is open
        gelesen();
      }, err => {
        reportClientError('messages-thread-load', err);
        $('msgs').innerHTML = `<div class="dm-empty">Nachrichten konnten nicht geladen werden.</div>`;
      });

      // Schreib-Indikator: nur zu zweit — typing.<otherUid> am Dokument.
      if (u.art === 'dm') {
        convUnsub = onSnapshot(doc(db, 'dms', u.id), snap => {
          const data = snap.data();
          const isTyping = !!(data && data.typing && data.typing[u.andere] === true);
          showTyping(isTyping, u.name);
        }, () => {});
      }

      setTimeout(() => $('msgInput').focus(), 60);
    }
    function closeThread() {
      if (msgUnsub) { msgUnsub(); msgUnsub = null; }
      if (convUnsub) { convUnsub(); convUnsub = null; }
      if (typingHideTimer) { clearTimeout(typingHideTimer); typingHideTimer = null; }
      // Eigenen Tipp-Status zurücksetzen, falls man mitten im Schreiben
      // den Thread verlässt — muss vor activeOther = null laufen.
      stopTypingNow();
      activeOther = null;
      aktiv = null;
      pilleVerbergen(false);
      $('threadView').style.display = 'none';
      $('listView').style.display = '';
      document.body.classList.remove('dm-thread');
    }
    $('threadBack').addEventListener('click', () => { if (history.state?.thread) history.back(); else closeThread(); });
    window.addEventListener('popstate', () => { if ($('threadView').style.display !== 'none') closeThread(); });

    /* Wer schrieb — in Gruppenchats und im Chat der Gruppe über jeder
       fremden Nachricht, zu zweit nicht nötig. */
    function absender(m) {
      if (!aktiv || aktiv.art === 'dm' || m.sender === me) return '';
      if (aktiv.art === 'gruppe') return m.senderName || '';
      return alleDms.find(c => c.id === aktiv.id)?.participantNames?.[m.sender] || '';
    }
    const karteDatum = tag => new Date(`${tag}T12:00:00`).toLocaleDateString('de-CH', { weekday:'short', day:'numeric', month:'short' });
    function karteHtml(k) {
      const gruppe = meineGruppen.find(g => g.id === k.gid);
      const kopf = [k.was === 'neu' ? 'Neu' : k.was === 'geaendert' ? 'Geändert' : '', artWort(k.art, gruppe?.art || 'kader'), k.gruppe]
        .filter(Boolean).join(' · ');
      const wann = [k.bis ? `${karteDatum(k.von)} – ${karteDatum(k.bis)}` : karteDatum(k.von), k.zeit, k.ort].filter(Boolean).join(' · ');
      /* "Zum Termin" nur, wo man ihn öffnen darf: in der eigenen Gruppe. */
      const link = gruppe
        ? `<a class="dm-karte__link" href="./gruppe.html?g=${encodeURIComponent(k.gid)}&termin=${encodeURIComponent(k.eid)}" data-termin-link data-kein-router>${escHtml(tOr('kal.zumTermin', 'Zum Termin'))} ›</a>`
        : '';
      return `<div class="dm-karte" style="${gruppe ? escHtml(`border-left-color:${gruppenFarbe(meineGruppen, gruppe.id)}`) : ''}">
        <span class="dm-karte__kopf">${escHtml(kopf)}</span>
        <strong class="dm-karte__titel">${escHtml(k.titel)}</strong>
        <span class="dm-karte__wann">${escHtml(wann)}</span>${link}</div>`;
    }

    function renderMessages(list) {
      const box = $('msgs');
      if (!list.length) { box.innerHTML = `<div class="dm-empty" style="border:0">Sag Hallo 👋</div>`; return; }
      let html = '', lastDay = '';
      for (const m of list) {
        const dk = dayKey(m.createdAt);
        if (dk && dk !== lastDay) { html += `<div class="dm-day-sep">${escHtml(dk)}</div>`; lastDay = dk; }
        const mine = m.sender === me;
        const wer = absender(m);
        const inhalt = m.termin ? karteHtml(m.termin) : mitEinladung(m.text);
        html += `<div class="dm-bubble ${mine ? 'me' : 'them'}">${wer ? `<span class="dm-sender">${escHtml(wer)}</span>` : ''}${inhalt}<span class="b-time">${clockTime(m.createdAt)}</span></div>`;
      }
      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    /* Eine Einladung in eine Gruppe (v.35.53.0) wird im Chat ein Link, der
       mit einem Tipp beitritt. NUR Einladungslinks dieser App — jede andere
       Adresse bleibt Text, der Chat wird kein Weg für fremde Links. */
    const WURZEL = APP_WURZEL.href;
    /* Seit v.35.60.0 formatiert (formatierung.js: **fett**, Listen …) —
       die Einladungslinks entstehen im schon maskierten Text. */
    function mitEinladung(text) {
      return `<div class="fmt">${formatiert(text, { inline: einladungsLinks })}</div>`;
    }
    function einladungsLinks(maskiert) {
      return maskiert.replace(/https?:\/\/[^\s<]+/g, url => {
        const roh = url.replace(/&amp;/g, '&');
        const code = roh.startsWith(WURZEL) ? codeSauber(roh) : '';
        return code
          ? `<a class="dm-einladung" href="${url}" data-einladung="${code}" data-kein-router>${url}</a>`
          : url;
      });
    }
    $('msgs').addEventListener('click', async e => {
      const zumTermin = e.target.closest('a[data-termin-link]');
      if (zumTermin) {
        e.preventDefault();
        const ziel = new URL(zumTermin.getAttribute('href'), location.href).href;
        if (!window.tvzaNavigate?.(ziel)) location.href = ziel;
        return;
      }
      const link = e.target.closest('a[data-einladung]');
      if (!link) return;
      e.preventDefault();
      try {
        const ergebnis = await einloesen(link.dataset.einladung, me);
        /* In den TVZA-Kreis: die ganze App neu, mit dem neuen Profil. */
        if (ergebnis?.kreis) { window.top.location.reload(); return; }
        const ziel = new URL('./gruppe.html', location.href).href;
        if (!window.tvzaNavigate?.(ziel)) location.href = ziel;
      } catch (err) {
        reportClientError('messages-einladung', err);
        await meldung({ titel: 'Der Beitritt hat nicht geklappt.', text: err?.message || '' });
      }
    });

    /* ════ Compose / send ════ */
    const input = $('msgInput'), sendBtn = $('sendBtn');
    let stopTypingTimer = null, typingOn = false, typingBeatTimer = null;
    function autoSize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
    function writeTyping(on) {
      if (!activeOther) return;
      updateDoc(doc(db, 'dms', convId(me, activeOther)), { ['typing.' + me]: on }).catch(() => {});
    }
    /* "true" wird wiederholt geschrieben, solange getippt wird. Jeder
       dieser Schreibvorgänge löst drüben einen Snapshot aus und setzt
       dort das Ausblende-Netz zurück. Ohne diesen Herzschlag stand das
       Flag zwar korrekt auf true, es kam aber kein neues Signal an — und
       der Indikator verschwand nach wenigen Sekunden, obwohl die andere
       Person noch schrieb. Geschrieben wird nur während des Tippens. */
    function setTyping(on) {
      typingOn = on;
      if (typingBeatTimer) { clearInterval(typingBeatTimer); typingBeatTimer = null; }
      writeTyping(on);
      if (on) typingBeatTimer = setInterval(() => writeTyping(true), TYPING_BEAT_MS);
    }
    function stopTypingNow() {
      if (stopTypingTimer) { clearTimeout(stopTypingTimer); stopTypingTimer = null; }
      if (typingOn) setTyping(false);
      else if (typingBeatTimer) { clearInterval(typingBeatTimer); typingBeatTimer = null; }
    }
    function pingTyping() {
      if (!activeOther) return;
      if (!typingOn) setTyping(true);
      if (stopTypingTimer) clearTimeout(stopTypingTimer);
      // Nach TYPING_IDLE_MS ohne weiteren Tastendruck gilt man als fertig.
      stopTypingTimer = setTimeout(() => setTyping(false), TYPING_IDLE_MS);
    }
    /* Tab schliessen oder wegwechseln, ohne den Thread zu verlassen:
       ohne das bliebe drüben ein "true" stehen, bis das Netz greift. */
    window.addEventListener('pagehide', stopTypingNow);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopTypingNow(); });
    /* Der Router lässt den Chat stehen, wenn man woanders hingeht
       (v.35.53.0) — unsichtbar, aber für den Browser nicht "hidden".
       Solange er geparkt ist, markiert er nichts als gelesen und tippt
       nicht; kommt man zurück in einen offenen Thread, ist er gelesen. */
    window.addEventListener('tvza-sichtbar', e => {
      if (!e.detail?.sichtbar) { stopTypingNow(); pilleVerbergen(false); return; }
      pilleVerbergen(!!aktiv);
      gelesen();
    });
    input.addEventListener('input', () => {
      autoSize(); sendBtn.disabled = !input.value.trim();
      /* Jede Änderung zählt — Tippen wie Löschen. Vorher hing es am
         Inhalt des Feldes: stand dort noch Text, galt man als
         schreibend, und Löschen beendete den Zustand sofort. Gemeint
         ist aber die Tätigkeit, nicht der Inhalt. */
      pingTyping();
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);
    /* Ein Knopfdruck nimmt dem Textfeld sonst den Fokus: die Tastatur
       fährt ein und sofort wieder aus, weil unten neu fokussiert wird.
       Das Unterdrücken des Standardverhaltens beim Antippen lässt den
       Fokus im Feld, die Tastatur bleibt einfach stehen. */
    sendBtn.addEventListener('pointerdown', e => e.preventDefault());
    sendBtn.addEventListener('mousedown', e => e.preventDefault());

    /* Schreiben — zu zweit, im Gruppenchat, im Chat der Gruppe. termin: die
       Karte eines Termins (dann ist text ihre Zeile). */
    async function schreiben(text, termin = null) {
      const u = aktiv;
      if (u.art === 'gruppe') {
        await gruppenNachricht({ gid: u.id, ich: me, meinName: myName, text, termin });
        return;
      }
      const convRef = doc(db, 'dms', u.id);
      if (u.art === 'runde') {
        const c = alleDms.find(x => x.id === u.id);
        const zahlen = {};
        for (const p of c?.participants || []) if (p !== me) zahlen['unread.' + p] = increment(1);
        await updateDoc(convRef, {
          lastMessage: text.slice(0, 140), lastAt: serverTimestamp(), lastSender: me,
          ['unread.' + me]: 0, ...zahlen,
        });
      } else {
        const other = u.andere;
        await setDoc(convRef, {
          participants: [me, other].sort(),
          participantNames: { [me]: myName, [other]: u.name },
          lastMessage: text.slice(0, 140),
          lastAt: serverTimestamp(),
          lastSender: me,
          unread: { [other]: increment(1), [me]: 0 },
          /* Verschachteltes Objekt, KEIN Punktpfad: setDoc deutet Punkte
             im Schlüssel nicht als Pfad, sondern legt ein Feld mit dem
             Namen "typing.<uid>" an. Das echte typing.<uid> blieb darum
             beim Senden auf true stehen — die Gegenseite sah "tippt…"
             erst recht, nachdem die Nachricht schon da war. Mit merge
             bleibt der Eintrag der anderen Person unberührt. */
          typing: { [me]: false }
        }, { merge: true });
      }
      await addDoc(collection(convRef, 'messages'), { text, sender: me, createdAt: serverTimestamp(), ...(termin ? { termin } : {}) });
    }

    let sending = false;
    async function send() {
      const text = input.value.trim();
      if (!text || !aktiv || sending) return;
      sending = true; sendBtn.disabled = true;
      // Herzschlag anhalten, bevor gesendet wird — sonst schreibt er
      // gleich nach dem "false" der Nachricht wieder ein "true".
      if (stopTypingTimer) { clearTimeout(stopTypingTimer); stopTypingTimer = null; }
      if (typingBeatTimer) { clearInterval(typingBeatTimer); typingBeatTimer = null; }
      typingOn = false;
      input.value = ''; autoSize();
      try {
        await schreiben(text);
      } catch (e) {
        reportClientError('message-send', e);
        await meldung({ titel: tOr('msg.f.senden', 'Die Nachricht konnte nicht gesendet werden.') });
        input.value = text; autoSize();
      } finally {
        sending = false; sendBtn.disabled = !input.value.trim();
        // Nur zurückholen, wenn der Fokus tatsächlich weg ist — ein
        // unnötiges focus() ist genau das, was die Tastatur neu aufruft.
        if (document.activeElement !== input) input.focus();
      }
    }

    /* ════ Einen Termin teilen (v.35.61.0) ════
       Wie die Karten des Assistenten: Art, Titel, wann, wo — und "Zum
       Termin" für alle, die in der Gruppe sind. Zur Wahl stehen die
       nächsten Termine der Gruppe (im Chat einer Gruppe) oder aller
       eigenen Gruppen. */
    $('terminTeilen').addEventListener('click', async () => {
      if (!aktiv) return;
      const gruppen = aktiv.art === 'gruppe' ? meineGruppen.filter(g => g.id === aktiv.id) : meineGruppen;
      const heute = new Date().toISOString().slice(0, 10);
      let termine = [];
      try {
        termine = (await Promise.all(gruppen.map(g => ladeTermine(g.id)
          .then(l => l.map(t => ({ ...t, gruppe: g }))).catch(() => [])))).flat()
          .filter(t => (t.bis || t.von) >= heute && !istAbgesagt(t))
          .sort((a, b) => `${a.von}${a.zeit || ''}`.localeCompare(`${b.von}${b.zeit || ''}`))
          .slice(0, 25);
      } catch (err) { reportClientError('messages-termine', err); }
      if (!termine.length) {
        await meldung({ titel: tOr('msg.terminTeilen', 'Termin teilen'), text: tOr('msg.keineTermine', 'In deinen Gruppen steht gerade kein Termin an.') });
        return;
      }
      const wahl = await waehle({
        titel: tOr('msg.terminTeilen', 'Termin teilen'),
        optionen: termine.map(t => ({
          wert: t, titel: t.titel || artWort(t.art, t.gruppe.art),
          text: [karteDatum(t.von), t.zeit, gruppen.length > 1 ? t.gruppe.name : ''].filter(Boolean).join(' · '),
        })),
      });
      if (!wahl) return;
      const karte = terminKarte(wahl, wahl.gruppe);
      if (!karte) return;
      try {
        await schreiben(karteText(karte, { datum: karteDatum, artWort: a => artWort(a, wahl.gruppe.art) }), karte);
      } catch (err) {
        reportClientError('messages-karte', err);
        await meldung({ titel: tOr('msg.f.senden', 'Die Nachricht konnte nicht gesendet werden.') });
      }
    });

    /* ════ Wem schreiben? ════
       Bis v.35.46.0 lud die Auswahl ALLE Konten der App und zeigte bei
       jedem die E-Mail — jedes Konto sah jedes andere, auch Kinder aus
       fremden Kadern. Seit v.35.62.0 stehen hier nur die Leute aus den
       eigenen Gruppen und die, mit denen man schon schreibt (Michel: "da
       sollten die Leute stehen, die bereits einen Chat mit dir angefangen
       haben, sowie die Leute, die in deiner Gruppe sind … und man sollte
       die E-Mail eintragen können"). Wer eine Adresse eintippt, findet das
       Konto dazu (personen.js, emailKarten) — gezeigt wird der Name, nie
       die Adresse eines anderen. Den Namen liefert die Namenskarte. */
    const userModal = $('userModal');
    let allUsers = null;
    let wahlArt = 'eins';            // 'eins': zu zweit · 'runde': Gruppenchat
    const gewaehlte = new Map();     // uid -> { uid, name } im Gruppenchat
    let gefunden = null;             // { uid, name } zur eingetippten Adresse
    let suchLauf = 0;
    async function loadUsers() {
      if (allUsers) return allUsers;
      let liste = [];
      try { liste = await kontakte(me); }
      catch (e) { reportClientError('messages-contacts-load', e); }
      const bekannt = new Set(liste.map(b => b.uid));
      for (const c of convs) {
        const other = otherOf(c);
        const name = String(c.participantNames?.[other] || '').trim();
        if (!other || bekannt.has(other) || !name) continue;
        bekannt.add(other);
        liste.push({ uid: other, name, gruppen: [] });
      }
      allUsers = liste.sort((a, b) => a.name.localeCompare(b.name, 'de'));
      return allUsers;
    }
    function personZeile(u, sub) {
      const an = gewaehlte.has(u.uid);
      return `
        <button class="dm-user${an ? ' is-an' : ''}" type="button" data-uid="${escHtml(u.uid)}" data-name="${escHtml(u.name)}"${wahlArt === 'runde' ? ` aria-pressed="${an}"` : ''}>
          <span class="dm-ava dm-ava--klein">${escHtml(initials(u.name))}</span>
          <span class="dm-user__wer"><span class="dm-user__name">${escHtml(u.name)}</span><small>${escHtml(sub)}</small></span>
          ${wahlArt === 'runde' ? '<span class="dm-user__haken" aria-hidden="true"></span>' : ''}
        </button>`;
    }
    function renderUsers(filter = '') {
      const list = sucheBekannte(allUsers || [], filter);
      const box = $('userList');
      const oben = gefunden && gefunden.uid !== me && !list.some(u => u.uid === gefunden.uid)
        ? personZeile(gefunden, tOr('msg.perAdresse', 'Über die Adresse gefunden'))
        : '';
      const hinweis = $('userHinweis');
      hinweis.textContent = gefunden === false ? tOr('msg.keinKonto', 'Zu dieser Adresse gibt es kein Konto.') : '';
      hinweis.hidden = !hinweis.textContent;
      if (!list.length && !oben) {
        box.innerHTML = (allUsers || []).length || filter
          ? `<div class="dm-empty dm-empty--still">${escHtml(tOr('msg.keineTreffer', 'Niemand gefunden. Du kannst auch eine Adresse eintippen.'))}</div>`
          : `<div class="dm-empty dm-empty--still">${escHtml(tOr('msg.nochNiemand', 'Hier stehen die Leute aus deinen Gruppen und alle, mit denen du schreibst. Andere findest du über ihre Adresse.'))}</div>`;
      } else {
        box.innerHTML = oben + list.map(u => personZeile(u, u.gruppen.length ? u.gruppen.join(' · ') : tOr('msg.schonGeschrieben', 'Schon geschrieben'))).join('');
      }
      const weiter = $('userWeiter');
      weiter.hidden = wahlArt !== 'runde';
      weiter.disabled = gewaehlte.size < RUNDE_MIN - 1;
      weiter.textContent = gewaehlte.size
        ? tOr('msg.weiterN', 'Weiter ({n})', { n: gewaehlte.size })
        : tOr('common.weiter', 'Weiter');
    }
    $('userList').addEventListener('click', e => {
      const b = e.target.closest('.dm-user');
      if (!b) return;
      if (wahlArt === 'eins') {
        userModal.classList.remove('visible');
        openThread(b.dataset.uid, b.dataset.name);
        return;
      }
      if (gewaehlte.has(b.dataset.uid)) gewaehlte.delete(b.dataset.uid);
      else gewaehlte.set(b.dataset.uid, { uid: b.dataset.uid, name: b.dataset.name });
      renderUsers($('userSearch').value.trim());
    });
    async function auswahlOeffnen(art) {
      wahlArt = art;
      gewaehlte.clear();
      gefunden = null;
      $('userTitel').textContent = art === 'runde' ? tOr('msg.gruppenchat', 'Gruppenchat') : tOr('msg.wem', 'Wem schreiben?');
      userModal.classList.add('visible');
      $('userList').innerHTML = `<div class="spinner">Lade…</div>`;
      $('userSearch').value = '';
      await loadUsers();
      renderUsers();
      setTimeout(() => $('userSearch').focus(), 60);
    }
    $('newChatBtn').addEventListener('click', () => auswahlOeffnen('eins'));
    $('newRundeBtn').addEventListener('click', () => auswahlOeffnen('runde'));
    /* Tippt jemand eine Adresse, wird nach dem Konto gefragt — erst, wenn
       sie vollständig aussieht, und nur die letzte Frage zählt. */
    $('userSearch').addEventListener('input', async () => {
      const text = $('userSearch').value.trim();
      const lauf = ++suchLauf;
      gefunden = null;
      renderUsers(istAdresse(text) ? '' : text);
      if (!istAdresse(text)) return;
      const person = await perAdresse(text);
      if (lauf !== suchLauf) return;
      gefunden = person || false;
      renderUsers('');
    });
    $('userCancel').addEventListener('click', () => userModal.classList.remove('visible'));
    userModal.addEventListener('click', e => { if (e.target === userModal) userModal.classList.remove('visible'); });

    /* Ein Gruppenchat (v.35.61.0): wer mitmacht, steht beim Anlegen fest
       (die Regel prüft es). */
    $('userWeiter').addEventListener('click', async () => {
      const andere = [...gewaehlte.values()];
      if (andere.length < RUNDE_MIN - 1) return;
      userModal.classList.remove('visible');
      const titel = await eingabe({
        titel: tOr('msg.rundeTitel', 'Wie heisst der Chat?'),
        wert: andere.map(p => p.name.split(' ')[0]).join(', ').slice(0, TITEL_MAX),
        maxlength: TITEL_MAX,
        ja: tOr('msg.rundeAnlegen', 'Anlegen'),
      });
      const pruefung = rundePruefen({ ich: me, andere: andere.map(p => p.uid), titel });
      if (!pruefung.ok) return;
      const ref = doc(collection(db, 'dms'));
      try {
        await setDoc(ref, {
          art: 'runde', titel: pruefung.titel, erstelltVon: me,
          participants: pruefung.leute,
          participantNames: Object.fromEntries([[me, myName], ...andere.map(p => [p.uid, p.name])]),
          lastMessage: '', lastAt: serverTimestamp(), lastSender: '', unread: {},
        });
        oeffne({ art: 'runde', id: ref.id, name: pruefung.titel, leute: pruefung.leute.length });
      } catch (err) {
        reportClientError('messages-runde', err);
        await meldung({ titel: tOr('msg.f.runde', 'Der Gruppenchat liess sich nicht anlegen.') });
      }
    });

    /* ════ Deep link: messages.html?to=<uid>&name=<optional> ════
       The &name= param lets this work for guest UIDs too — guests live in
       guestProfiles, not the users collection, so the lookup below would
       silently fail to resolve a display name for them without it. */
    const toUid = new URLSearchParams(location.search).get('to');
    const toName = new URLSearchParams(location.search).get('name');
    if (toUid && toUid !== me) {
      if (toName) {
        openThread(toUid, toName);
      } else {
        /* Die Namenskarte statt der Liste aller Konten — die gibt es
           nicht mehr. Ohne Karte kein Name — und ohne Namen keine
           Unterhaltung, sonst stünde 'Unbekannt' für immer darin. */
        const name = await nameVon(toUid);
        if (name) openThread(toUid, name);
      }
    }
  </script>
  <script type="module" src="../assets/js/nav.js?v=26"></script>
