<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1A1A2E" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%231a1a2e'/><stop offset='.55' stop-color='%2316213e'/><stop offset='1' stop-color='%230f3460'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23g)'/><text x='16' y='22' font-family='Georgia,serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'>TvZ</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" />
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>Anmelden — TVZA</title>
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      padding: var(--s6) 28px;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      text-align: center;
      font-size: var(--text-2xl);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--ink);
      margin-bottom: 4px;
      text-wrap: balance;
    }
    .login-sub {
      text-align: center;
      font-size: var(--text-sm);
      color: var(--ink-soft);
      margin-bottom: var(--s5);
    }
    .login-error {
      background: var(--accent-bg);
      color: var(--accent);
      font-size: var(--text-sm);
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--r1);
      margin-bottom: 14px;
      display: none;
    }
    .login-error.visible { display: block; }
    .switch-mode {
      text-align: center;
      font-size: var(--text-sm);
      color: var(--ink-soft);
      margin-top: 18px;
    }
    .switch-mode a { color: var(--accent); font-weight: 700; cursor: pointer; transition: color 150ms ease; }
    .switch-mode a:hover { color: var(--accent-hover); }
  </style>
  <link rel="stylesheet" href="assets/css/ui-fx.css?v=15" />
  <script src="assets/js/ui-fx.js?v=18" defer></script>
</head>
<body>
  <span id="themeToggle" title="Theme wechseln" style="position:fixed;top:14px;right:14px;cursor:pointer;color:var(--ink-soft);font-size:20px;line-height:1;padding:8px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;z-index:10">◐</span>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">TVZA</div>
      <p class="login-sub" id="subTitle">Willkommen zurück! Melde dich an.</p>

      <div class="login-error" id="errBox"></div>

      <form id="loginForm" novalidate>
        <!-- Name (only for registration) -->
        <div class="form-group" id="nameGroup" style="display:none">
          <label class="form-label" for="fName">Dein Name</label>
          <input class="form-input" id="fName" name="name" type="text" placeholder="z.B. Timo" autocomplete="name" />
        </div>

        <div class="form-group" id="inviteGroup" style="display:none">
          <label class="form-label" for="fInvite">Einladungscode (optional)</label>
          <input class="form-input" id="fInvite" name="invite" type="text"
                 placeholder="Nur für eine direkte Gruppeneinladung"
                 autocomplete="one-time-code" autocapitalize="none" autocorrect="off" spellcheck="false" />
          <p class="form-hint">Ohne Code erhältst du ein persönliches TVZA-Konto. Ein Code kann dich direkt einer Kalendergruppe hinzufügen.</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="fEmail">E-Mail</label>
          <input class="form-input" id="fEmail" name="email" type="email" placeholder="deine@email.com" autocomplete="username" inputmode="email" autocapitalize="none" />
        </div>

        <div class="form-group">
          <label class="form-label" for="fPass">Passwort</label>
          <input class="form-input" id="fPass" name="password" type="password" placeholder="mind. 6 Zeichen" autocomplete="current-password" autocapitalize="none" />
        </div>

        <button class="btn btn-primary btn-block" id="submitBtn" type="submit" style="padding:12px">Anmelden</button>
      </form>

      <p class="switch-mode" id="switchText">
        Noch kein Konto? <a id="switchLink">Registrieren</a>
      </p>
      <p class="switch-mode" style="margin-top:8px">
        <a href="public.html">← Zur öffentlichen Projektseite</a>
      </p>
    </div>
  </div>

  <script type="module">
    import {
      auth, db, DEFAULT_MODULES, getTvzaConfig
    } from './assets/js/firebase-config.js';
    import {
      emailAccessAllowed, requiresVerifiedEmail
    } from './assets/js/email-verification-policy.js';
    import {
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      deleteUser, signOut, sendEmailVerification, reload as reloadUser
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import {
      doc, getDoc, serverTimestamp, writeBatch, arrayUnion
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import {
      loginLockRemaining, recordLoginFailure, clearLoginFailures
    } from './assets/js/auth-security.js';

    // Already logged in? Go straight to the hub.
    let authActionInProgress = false;
    auth.onAuthStateChanged(async user => {
      if (!user || authActionInProgress) return;
      const tvzaConfig = await getTvzaConfig();
      if (emailAccessAllowed(user, tvzaConfig)) {
        window.location.href = 'index.html';
        return;
      }
      await signOut(auth).catch(() => {});
      showErr('Bitte bestätige zuerst deine E-Mail-Adresse. Der Bestätigungslink wurde bei der Registrierung verschickt.');
    });

    let mode = 'login'; // or 'register'

    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    if (params.get('reason') === 'verify') {
      showErr('Bitte bestätige zuerst deine E-Mail-Adresse.');
    } else if (params.get('reason') === 'membership') {
      showErr('Für dieses Konto wurde noch kein TVZA-Profil gefunden.');
    } else if (params.get('verified') === '1') {
      showErr('E-Mail bestätigt. Du kannst dich jetzt anmelden.');
    }

    function setMode(nextMode) {
      mode = nextMode;
      $('nameGroup').style.display = mode === 'register' ? '' : 'none';
      $('inviteGroup').style.display = mode === 'register' ? '' : 'none';
      $('subTitle').textContent = mode === 'register'
        ? 'Erstelle dein TVZA-Konto. Eine Gruppeneinladung ist optional.'
        : 'Willkommen zurück! Melde dich an.';
      $('submitBtn').textContent = mode === 'register' ? 'Registrieren' : 'Anmelden';
      $('switchText').firstChild.textContent = mode === 'register' ? 'Schon ein Konto? ' : 'Noch kein Konto? ';
      $('switchLink').textContent = mode === 'register' ? 'Anmelden' : 'Registrieren';
      $('fPass').setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
      hideErr();
    }

    $('switchLink').addEventListener('click', () => {
      setMode(mode === 'login' ? 'register' : 'login');
    });

    const inviteParam = params.get('invite')?.trim() || '';
    if (inviteParam) {
      setMode('register');
      $('fInvite').value = inviteParam;
    }

    function showErr(msg) { $('errBox').textContent = msg; $('errBox').classList.add('visible'); }
    function hideErr()    { $('errBox').classList.remove('visible'); }

    function translateError(code, action) {
      if (code === 'auth/network-request-failed' || code === 'unavailable') {
        return 'Keine Internetverbindung. Bitte versuche es erneut.';
      }
      if (code === 'auth/weak-password') {
        return 'Bitte verwende ein Passwort mit mindestens 6 Zeichen.';
      }
      if (action === 'register' && code === 'permission-denied') {
        return 'Dieser Einladungscode passt nicht zu dieser E-Mail.';
      }
      if (code === 'email-not-verified') {
        return 'Bitte bestätige zuerst deine E-Mail-Adresse. Wir haben dir erneut einen Bestätigungslink geschickt.';
      }
      if (code === 'auth/too-many-requests' || code === 'login-locked') {
        return 'Zu viele fehlgeschlagene Versuche. Bitte warte 15 Minuten und versuche es dann erneut.';
      }
      if (action === 'register') {
        return 'Konto konnte nicht erstellt werden. Prüfe Einladung, E-Mail und Passwort.';
      }
      // One message for every credential failure prevents account enumeration
      // and never exposes Firebase error codes.
      return 'Anmeldung nicht möglich. Prüfe E-Mail und Passwort.';
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideErr();
      const email = $('fEmail').value.trim();
      const pass  = $('fPass').value;
      const name  = $('fName').value.trim();
      const inviteCode = $('fInvite').value.trim();

      if (!email || !pass) { showErr('Bitte E-Mail und Passwort eingeben.'); return; }
      if (mode === 'register' && !name) { showErr('Bitte deinen Namen eingeben.'); return; }
      if (mode === 'login' && loginLockRemaining(localStorage) > 0) {
        showErr(translateError('login-locked', mode));
        return;
      }

      $('submitBtn').disabled = true;
      $('submitBtn').textContent = 'Bitte warten…';
      authActionInProgress = true;
      let createdUser = null;
      let registrationCommitted = false;
      let loginAuthenticated = false;

      try {
        if (mode === 'register') {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          createdUser = cred.user;
          let familyId = null;
          let inviteRef = null;
          if (inviteCode) {
            inviteRef = doc(db, 'memberInvites', inviteCode);
            const invite = await getDoc(inviteRef);
            if (!invite.exists()) throw { code: 'permission-denied' };
            familyId = typeof invite.data().familyId === 'string' ? invite.data().familyId : null;
          }

          const batch = writeBatch(db);
          batch.set(doc(db, 'users', cred.user.uid), {
            displayName: name,
            email: email.toLowerCase(),
            familyId,
            role: 'member',
            isTimo: false,
            allowedModules: { ...DEFAULT_MODULES },
            modules: { ...DEFAULT_MODULES },
            createdAt: serverTimestamp(),
            inviteCode: inviteCode || null
          });
          if (familyId) {
            batch.update(doc(db, 'families', familyId), {
              members: arrayUnion(cred.user.uid)
            });
          }
          if (inviteRef) batch.delete(inviteRef);
          await batch.commit();
          registrationCommitted = true;

          const tvzaConfig = await getTvzaConfig();
          if (requiresVerifiedEmail(tvzaConfig)) {
            const verificationSent = await sendEmailVerification(cred.user, {
              url: new URL('login.html?verified=1', location.href).href
            }).then(() => true).catch(() => false);
            await signOut(auth);
            authActionInProgress = false;
            $('loginForm').reset();
            setMode('login');
            showErr(verificationSent
              ? 'Konto erstellt. Bitte öffne jetzt den Bestätigungslink in deiner E-Mail. Erst danach kannst du dich anmelden.'
              : 'Konto erstellt, aber der Bestätigungslink konnte nicht gesendet werden. Melde dich einmal an, um den Versand erneut auszulösen.');
            $('submitBtn').disabled = false;
            return;
          }
          sessionStorage.setItem('tvza-send-verification', '1');
        } else {
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          loginAuthenticated = true;
          await reloadUser(cred.user);
          const tvzaConfig = await getTvzaConfig();
          if (!emailAccessAllowed(cred.user, tvzaConfig)) {
            await sendEmailVerification(cred.user, {
              url: new URL('login.html?verified=1', location.href).href
            }).catch(() => {});
            await signOut(auth);
            throw { code: 'email-not-verified' };
          }
          const profile = await getDoc(doc(db, 'users', cred.user.uid));
          if (!profile.exists()) {
            await signOut(auth);
            throw { code: 'membership-required' };
          }
          clearLoginFailures(localStorage);
        }
        sessionStorage.setItem('tvza-just-logged-in', '1'); // Welcome-Animation auslösen
        window.location.href = 'index.html';
      } catch (err) {
        // If profile creation is rejected, remove the just-created Auth account
        // so the invited person can correct the code and try again.
        if (createdUser && !registrationCommitted) await deleteUser(createdUser).catch(() => {});
        if (mode === 'login' && !loginAuthenticated) recordLoginFailure(localStorage);
        authActionInProgress = false;
        showErr(translateError(err?.code, mode));
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = mode === 'register' ? 'Registrieren' : 'Anmelden';
      }
    });

  </script>
</body>
</html>
